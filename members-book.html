<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ସଦସ୍ୟ ପଞ୍ଜି | ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,"Noto Sans Oriya",sans-serif;
    padding:12px;
}

.container{
    max-width:1100px;
    margin:auto;
}


/* =========================
   HEADER
========================= */

.header{
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:15px;
    padding:15px;
    text-align:center;
    margin-bottom:12px;
}

.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
    padding:3px;
    margin-bottom:7px;
}

.header h1{
    color:#ffd700;
    font-size:25px;
    line-height:1.4;
}

.header h2{
    color:#fff;
    font-size:20px;
    margin-top:3px;
}

.header p{
    color:#bbb;
    margin-top:5px;
    font-size:14px;
}


/* =========================
   CONTROL BOX
========================= */

.controls{
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:12px;
    padding:10px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;

    margin-bottom:10px;
}

.search{
    width:240px;
    padding:11px 13px;
    border:none;
    outline:none;
    border-radius:8px;
    font-size:15px;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 14px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.prev{
    background:#555;
    color:#fff;
}

.next{
    background:#087df0;
    color:#fff;
}

.print{
    background:#198754;
    color:#fff;
}

.printAll{
    background:#dc3545;
    color:#fff;
}

button:disabled{
    opacity:.35;
    cursor:not-allowed;
}


/* =========================
   PAGE INFO
========================= */

.pageInfo{
    text-align:center;
    color:#ffd700;
    font-size:16px;
    font-weight:bold;
    margin:10px 0;
}


/* =========================
   MEMBERS GRID
========================= */

.members{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}


/* =========================
   MEMBER CARD
========================= */

.member{
    background:#202020;
    border:1px solid #555;
    border-radius:10px;
    padding:9px;

    display:flex;
    gap:10px;

    min-height:130px;
}

.memberNo{
    position:absolute;
}

.photo{
    width:80px;
    height:95px;

    flex-shrink:0;

    background:#333;
    border-radius:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.noPhoto{
    font-size:32px;
    color:#888;
}

.details{
    flex:1;
    min-width:0;
}

.details h3{
    color:#ffd700;
    font-size:17px;
    margin-bottom:5px;
    word-break:break-word;
}

.details p{
    font-size:13px;
    color:#ddd;
    margin:3px 0;
    line-height:1.3;
    word-break:break-word;
}

.details b{
    color:#fff;
}


/* =========================
   LOADING / EMPTY
========================= */

.loading,
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:45px 10px;
    color:#ffd700;
    font-size:18px;
}


/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    color:#888;
    font-size:12px;
    margin:15px 0;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        padding:7px;
    }

    .header{
        padding:12px 8px;
    }

    .logo{
        width:70px;
        height:70px;
    }

    .header h1{
        font-size:20px;
    }

    .header h2{
        font-size:17px;
    }

    .members{
        grid-template-columns:1fr;
    }

    .member{
        min-height:125px;
    }

    .photo{
        width:75px;
        height:90px;
    }

    .details h3{
        font-size:16px;
    }

    .details p{
        font-size:12px;
    }

    .search{
        width:100%;
    }

}


/* =================================================
   PRINT
================================================= */

@media print{

    @page{
        size:A4 portrait;
        margin:8mm;
    }

    body{
        background:#fff !important;
        color:#000 !important;
        padding:0;
    }

    .container{
        width:100%;
        max-width:none;
    }

    .controls{
        display:none !important;
    }

    .pageInfo{
        display:none !important;
    }

    .footer{
        display:none !important;
    }

    .header{
        background:#fff !important;
        border:0;
        border-bottom:2px solid #000;
        border-radius:0;
        padding:0 0 6px 0;
        margin-bottom:7px;
    }

    .logo{
        width:55px;
        height:55px;
        padding:0;
        margin-bottom:2px;
    }

    .header h1{
        color:#000 !important;
        font-size:18px;
    }

    .header h2{
        color:#000 !important;
        font-size:15px;
    }

    .header p{
        color:#000 !important;
        font-size:10px;
    }

    .members{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:5px;
    }

    .member{
        background:#fff !important;
        color:#000 !important;
        border:1px solid #555;
        border-radius:3px;
        padding:5px;

        min-height:0;
        height:82px;

        break-inside:avoid;
        page-break-inside:avoid;
    }

    .photo{
        width:52px;
        height:65px;
        background:#eee;
        border-radius:2px;
    }

    .noPhoto{
        font-size:22px;
        color:#777;
    }

    .details h3{
        color:#000 !important;
        font-size:11px;
        margin-bottom:2px;
    }

    .details p{
        color:#000 !important;
        font-size:8px;
        margin:1px 0;
        line-height:1.15;
    }

    .details b{
        color:#000 !important;
    }

}


/* =================================================
   PRINT ALL - PAGE BREAK
================================================= */

.print-all-card{
    break-inside:avoid;
    page-break-inside:avoid;
}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <img
            src="./logo.png"
            class="logo"
            alt="ସଂଘ Logo"
            onerror="this.style.display='none';"
        >

        <h1>
            ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ
        </h1>

        <h2>
            ସୁରତ
        </h2>

        <p>
            📖 ସଦସ୍ୟ ପଞ୍ଜି
        </p>

    </div>


    <!-- =========================
         CONTROLS
    ========================== -->

    <div class="controls">

        <input
            type="text"
            id="search"
            class="search"
            placeholder="🔍 ନାମ / ମୋବାଇଲ ଖୋଜନ୍ତୁ"
        >


        <button
            class="prev"
            id="prevBtn"
            onclick="previousPage()">

            ⬅️ ପୂର୍ବ

        </button>


        <button
            class="next"
            id="nextBtn"
            onclick="nextPage()">

            ପରବର୍ତ୍ତୀ ➡️

        </button>


        <button
            class="print"
            onclick="printCurrentPage()">

            🖨️ ଏହି Page Print

        </button>


        <button
            class="printAll"
            onclick="printAllMembers()">

            🖨️ ସମସ୍ତ Print

        </button>

    </div>


    <!-- =========================
         PAGE INFO
    ========================== -->

    <div
        id="pageInfo"
        class="pageInfo">

        Page 1 / 1

    </div>


    <!-- =========================
         MEMBERS
    ========================== -->

    <div
        id="members"
        class="members">

        <div class="loading">

            ⏳ ସଦସ୍ୟମାନଙ୍କୁ ଆଣୁଛି...

        </div>

    </div>


    <div class="footer">

        ଓଡ଼ିଆ ରତ୍ନ କ
