<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
ସଦସ୍ୟ ପଞ୍ଜି | ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ
</title>


<style>

/* ==================================================
   BASIC
================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,"Noto Sans Oriya",sans-serif;
    padding:10px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
}


/* ==================================================
   HEADER
================================================== */

.header{
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:15px;
    padding:14px 10px;
    text-align:center;
    margin-bottom:10px;
}

.logo{
    width:82px;
    height:82px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:2px;
    margin-bottom:5px;
}

.header h1{
    color:#ffd700;
    font-size:24px;
    line-height:1.4;
}

.header h2{
    color:white;
    font-size:19px;
    margin-top:2px;
}

.header p{
    color:#bbb;
    font-size:13px;
    margin-top:4px;
}


/* ==================================================
   STATS
================================================== */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:10px;
}

.stat{
    background:#202020;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.stat .icon{
    font-size:20px;
}

.stat span{
    display:block;
    color:#ccc;
    font-size:12px;
    margin:3px 0;
}

.stat b{
    display:block;
    font-size:23px;
}

.total b{
    color:#ffd700;
}

.submitted b{
    color:#00e676;
}

.pending b{
    color:#ff9800;
}


/* ==================================================
   CONTROLS
================================================== */

.controls{
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:11px;
    padding:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:6px;
    flex-wrap:wrap;

    margin-bottom:8px;
}

.search{
    width:240px;
    max-width:100%;

    padding:10px 12px;

    border:none;
    border-radius:8px;

    outline:none;

    font-size:14px;
}

button{
    border:none;
    border-radius:8px;

    padding:10px 12px;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
}

button:disabled{
    opacity:.35;
    cursor:not-allowed;
}


/* FILTER BUTTONS */

.statusAll{
    background:#555;
    color:white;
}

.statusSubmitted{
    background:#198754;
    color:white;
}

.statusPending{
    background:#ff9800;
    color:white;
}


/* PAGE BUTTONS */

.prev{
    background:#555;
    color:white;
}

.next{
    background:#087df0;
    color:white;
}

.print{
    background:#198754;
    color:white;
}

.printAll{
    background:#dc3545;
    color:white;
}


/* ==================================================
   PAGE INFO
================================================== */

.pageInfo{
    text-align:center;

    color:#ffd700;

    font-size:15px;

    font-weight:bold;

    margin:9px 0 12px;
}


/* ==================================================
   MEMBERS
================================================== */

.members{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;
}


/* ==================================================
   MEMBER CARD
================================================== */

.member{
    background:#202020;

    border:1px solid #555;

    border-radius:10px;

    padding:8px;

    display:flex;

    gap:9px;

    min-height:150px;
}


/* ==================================================
   PHOTO
================================================== */

.photo{
    width:78px;
    height:94px;

    flex-shrink:0;

    background:#333;

    border-radius:7px;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;
}

.photo img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.noPhoto{
    font-size:30px;
    color:#888;
}


/* ==================================================
   DETAILS
================================================== */

.details{
    flex:1;
    min-width:0;
}

.details h3{
    color:#ffd700;

    font-size:17px;

    margin-bottom:5px;

    word-break:break-word;
}

.details p{
    color:#ddd;

    font-size:12px;

    margin:3px 0;

    line-height:1.3;

    word-break:break-word;
}

.details b{
    color:white;
}


/* ==================================================
   DOCUMENT STATUS
================================================== */

.documentStatus{
    display:inline-block;

    margin-top:4px;

    padding:5px 8px;

    border-radius:6px;

    font-size:11px;

    font-weight:bold;
}

.statusOk{
    background:#198754;
    color:white;
}

.statusWait{
    background:#ff9800;
    color:white;
}


/* ==================================================
   VERIFY BUTTON
================================================== */

.verifyBtn{
    margin-top:6px;

    background:#087df0;

    color:white;

    padding:7px 9px;

    font-size:11px;

    width:100%;
}


/* ==================================================
   LOADING
================================================== */

.loading,
.empty{

    grid-column:1/-1;

    text-align:center;

    padding:45px 10px;

    color:#ffd700;

    font-size:18px;
}


/* ==================================================
   FOOTER
================================================== */

.footer{
    text-align:center;

    color:#888;

    font-size:12px;

    margin:15px 0;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:700px){

    body{
        padding:7px;
    }

    .header{
        padding:12px 7px;
    }

    .logo{
        width:75px;
        height:75px;
    }

    .header h1{
        font-size:20px;
    }

    .header h2{
        font-size:17px;
    }

    .members{
        grid-template-columns:1fr;
    }

    .member{
        min-height:150px;
    }

    .photo{
        width:75px;
        height:90px;
    }

    .details h3{
        font-size:16px;
    }

    .details p{
        font-size:12px;
    }

    .search{
        width:100%;
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .stat{
        padding:7px 3px;
    }

    .stat .icon{
        font-size:17px;
    }

    .stat span{
        font-size:10px;
    }

    .stat b{
        font-size:19px;
    }

}


/* ==================================================
   PRINT
================================================== */

@media print{

    @page{
        size:A4 portrait;
        margin:8mm;
    }

    body{
        background:white !important;
        color:black !important;
        padding:0;
    }

    .container{
        max-width:none;
        width:100%;
    }

    .controls,
    .pageInfo,
    .footer,
    .stats{
        display:none !important;
    }

    .header{
        background:white !important;
        border:0;
        border-bottom:2px solid black;
        border-radius:0;
        padding:0 0 6px;
        margin-bottom:7px;
    }

    .logo{
        width:55px;
        height:55px;
        padding:0;
    }

    .header h1{
        color:black !important;
        font-size:18px;
    }

    .header h2{
        color:black !important;
        font-size:15px;
    }

    .header p{
        color:black !important;
        font-size:10px;
    }

    .members{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:5px;
    }

    .member{
        background:white !important;
        color:black !important;
        border:1px solid #555;
        border-radius:3px;
        padding:5px;
        min-height:0;
        height:95px;
        break-inside:avoid;
        page-break-inside:avoid;
    }

    .photo{
        width:52px;
        height:65px;
        background:#eee;
    }

    .photo img{
        width:100%;
        height:100%;
        object-fit:cover;
    }

    .details h3{
        color:black !important;
        font-size:11px;
        margin-bottom:2px;
    }

    .details p{
        color:black !important;
        font-size:8px;
        margin:1px 0;
        line-height:1.15;
    }

    .details b{
        color:black !important;
    }

    .documentStatus{
        padding:2px 4px;
        font-size:7px;
        color:black !important;
        background:white !important;
        border:1px solid #555;
    }

    .verifyBtn{
        display:none !important;
    }

    .printBreak{
        display:block;
        break-after:page;
        page-break-after:always;
    }
}


/* ==================================================
   PRINT PAGE BREAK
================================================== */

.printBreak{
    display:block;
    break-after:page;
    page-break-after:always;
}

</style>

</head>


<body>


<div class="container">

<div class="header">

    >

    </h1>

    <h2>

    </h2>

    <p>
        📖 ସଦସ୍ୟ ପଞ୍ଜି
    </p>

</div>


<!-- ==================================================

================================================== -->

<div class="stats">

    <div class="stat total">

    >

<!-- ==================================================

<div
    id="pageInfo"

<!-- ==================================================

================================================== -->

<div
    id="members"
    class="members">

    <div class="loading">

        ⏳ ସଦସ୍ୟମାନଙ୍କୁ ଆଣୁଛି...

    </div>

</div>


<div class="footer">

    ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ • Member Register

<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import { db } from "./firebase.js";


import {

    collection,
    getDocs,
    doc,
    updateDoc,
    serverTimestamp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   VARIABLES
================================================== */

let allMembers = [];

let filteredMembers = [];

let currentPage = 1;

const MEMBERS_PER_PAGE = 20;


/*
   Current document filter
*/

let currentDocumentFilter = "all";


/* ==================================================
   LOAD MEMBERS
================================================== */

async function loadMembers(){

    const box =
        document.getElementById(
            "members"
        );


    try{

        box.innerHTML = `

            <div class="loading">

                ⏳ ସଦସ୍ୟମାନଙ୍କୁ ଆଣୁଛି...

            </div>

        `;


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "members"
                )
            );


        console.log(
            "Members found:",
            snapshot.size
        );


        allMembers = [];


        snapshot.forEach(
            documentSnapshot => {

                allMembers.push({

                    firestoreId:
                        documentSnapshot.id,

                    ...documentSnapshot.data()

                });

            }
        );


        /*
           Oldest registration first
        */

        allMembers.sort(
            (a,b)=>{

                const aTime =
                    getTime(
                        a.createdAt
                    );


                const bTime =
                    getTime(
                        b.createdAt
                    );


                return aTime - bTime;

            }
        );


        updateDocumentCounts();


        applyCurrentFilter();


    }


    catch(error){

        console.error(
            "FIREBASE ERROR:",
            error
        );


        box.innerHTML = `

            <div class="empty">

                ❌ ସଦସ୍ୟମାନଙ୍କୁ ଆଣିବାରେ
                ସମସ୍ୟା ହେଲା।

                <br><br>

                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>

            </div>

        `;

    }

}


/* ==================================================
   FIREBASE TIMESTAMP
================================================== */

function getTime(value){

    if(!value){
        return 0;
    }


    if(
        typeof value.seconds ===
        "number"
    ){

        return value.seconds * 1000;

    }


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    return 0;

}


/* ==================================================
   UPDATE COUNTS
================================================== */

function updateDocumentCounts(){

    const total =
        allMembers.length;


    const submitted =
        allMembers.filter(
            member =>
                member.documentStatus ===
                "submitted"
        ).length;


    const pending =
        total - submitted;


    document.getElementById(
        "totalCount"
    ).textContent = total;


    document.getElementById(
        "submittedCount"
    ).textContent = submitted;


    document.getElementById(
        "pendingCount"
    ).textContent = pending;

}


/* ==================================================
   APPLY CURRENT FILTER
================================================== */

function applyCurrentFilter(){

    if(
        currentDocumentFilter ===
        "submitted"
    ){

        filteredMembers =
            allMembers.filter(
                member =>
                    member.documentStatus ===
                    "submitted"
            );

    }


    else if(
        currentDocumentFilter ===
        "pending"
    ){

        filteredMembers =
            allMembers.filter(
                member =>
                    member.documentStatus !==
                    "submitted"
            );

    }


    else{

        filteredMembers =
            [...allMembers];

    }


    /*
       Search apply
    */

    const searchInput =
        document.getElementById(
            "search"
        );


    const value =
        searchInput.value
        .trim()
        .toLowerCase();


    if(value){

        filteredMembers =
            filteredMembers.filter(
                member => {

                    const name =
                        String(
                            member.name ||
                            ""
                        )
                        .toLowerCase();


                    const mobile =
                        String(
                            member.mobile ||
                            ""
                        )
                        .toLowerCase();


                    const father =
                        String(
                            member.father ||
                            ""
                        )
                        .toLowerCase();


                    const memberId =
                        String(
                            member.memberId ||
                            ""
                        )
                        .toLowerCase();


                    return (

                        name.includes(value)

                        ||

                        mobile.includes(value)

                        ||

                        father.includes(value)

                        ||

                        memberId.includes(value)

                    );

                }
            );

    }


    currentPage = 1;

    renderPage();

}


/* ==================================================
   DOCUMENT FILTER
================================================== */

window.filterDocumentStatus =
function(status){

    currentDocumentFilter =
        status;


    applyCurrentFilter();

};


/* ==================================================
   RENDER PAGE
================================================== */

function renderPage(){

    const box =
        document.getElementById(
            "members"
        );


    const totalPages =
        Math.max(

            1,

            Math.ceil(

                filteredMembers.length /
                MEMBERS_PER_PAGE

            )

        );


    if(
        currentPage >
        totalPages
    ){

        currentPage =
            totalPages;

    }


    const start =
        (currentPage - 1) *
        MEMBERS_PER_PAGE;


    const end =
        start +
        MEMBERS_PER_PAGE;


    const pageMembers =
        filteredMembers.slice(
            start,
            end
        );


    box.innerHTML = "";


    if(
        pageMembers.length === 0
    ){

        box.innerHTML = `

            <div class="empty">

                ❌ କୌଣସି ସଦସ୍ୟ ମିଳିଲେ ନାହିଁ।

            </div>

        `;

    }


    pageMembers.forEach(
        (member,index)=>{

            const card =
                createMemberCard(
                    member,
                    start + index + 1
                );


            box.appendChild(card);

        }
    );


    document
        .getElementById(
            "pageInfo"
        )
        .textContent =

        `Page ${currentPage} / ${totalPages}
         • ମୋଟ: ${filteredMembers.length}`;


    document
        .getElementById(
            "prevBtn"
        )
        .disabled =
        currentPage <= 1;


    document
        .getElementById(
            "nextBtn"
        )
        .disabled =
        currentPage >= totalPages;

}


/* ==================================================
   CREATE MEMBER CARD
================================================== */

function createMemberCard(
    member,
    number
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "member";


    const name =
        member.name ||
        "ନାମ ନାହିଁ";


    const father =
        member.father ||
        "-";


    const mobile =
        member.mobile ||
        "-";


    const address =
        member.address ||
        "-";


    const memberId =
        member.memberId ||
        `ORKS-${String(number).padStart(3,"0")}`;


    const photo =
        member.photoUrl ||
        "";


    const isSubmitted =
        member.documentStatus ===
        "submitted";


    /* ==================================================
       PHOTO
    ================================================== */

    let photoHTML = "";


    if(photo){

        photoHTML = `

            <img

                src="${escapeAttribute(
                    photo
                )}"

                alt="${escapeAttribute(
                    name
                )}"

                loading="lazy"

                onerror="
                    this.style.display='none';
                    this.parentElement.innerHTML='<span class=noPhoto>👤</span>';
                "

            >

        `;

    }

    else{

        photoHTML = `

            <span class="noPhoto">

                👤

            </span>

        `;

    }


    /* ==================================================
       DOCUMENT AREA
    ================================================== */

    let documentHTML = "";


    if(isSubmitted){

        documentHTML = `

            <p>

                <span
                    class="documentStatus statusOk">

                    📄 Document ଜମା

                </span>

            </p>


            <p>

                <b>Verified:</b>

                ${formatDate(
                    member.documentVerifiedAt
                )}

            </p>

        `;

    }

    else{

        documentHTML = `

            <p>

                <span
                    class="documentStatus statusWait">

                    ⏳ Document ବାକି

                </span>

            </p>


            <button

                class="verifyBtn"

                onclick="verifyAndSubmit(
                    '${escapeAttribute(
                        member.firestoreId
                    )}'
                )">

                🔍 Verify & Submit

            </button>

        `;

    }


    /* ==================================================
       CARD
    ================================================== */

    card.innerHTML = `

        <div class="photo">

            ${photoHTML}

        </div>


        <div class="details">

            <h3>

                ${escapeHTML(name)}

            </h3>


            <p>

                <b>ସଦସ୍ୟ ନଂ:</b>

                ${escapeHTML(memberId)}

            </p>


            <p>

                <b>ପିତା:</b>

                ${escapeHTML(father)}

            </p>


            <p>

                <b>ମୋବାଇଲ:</b>

                ${escapeHTML(mobile)}

            </p>


            <p>

                <b>ଠିକଣା:</b>

                ${escapeHTML(address)}

            </p>


            ${documentHTML}

        </div>

    `;


    return card;

}


/* ==================================================
   VERIFY & SUBMIT
================================================== */

window.verifyAndSubmit =
async function(memberId){

    const member =
        allMembers.find(
            m =>
                m.firestoreId ===
                memberId
        );


    if(!member){

        alert(
            "❌ Member ମିଳିଲା ନାହିଁ।"
        );

        return;

    }


    const memberName =
        member.name ||
        "ଏହି Member";


    const confirmed =
        confirm(

            `${memberName}ଙ୍କ Document Office ରେ ଯାଞ୍ଚ ହୋଇଛି କି?\n\n` +

            `OK = Verify & Submit\n` +

            `Cancel = ବାତିଲ`

        );


    if(!confirmed){

        return;

    }


    try{

        /*
           FIRESTORE UPDATE
        */

        await updateDoc(

            doc(
                db,
                "members",
                memberId
            ),

            {

                documentStatus:
                    "submitted",

                documentVerifiedAt:
                    serverTimestamp()

            }

        );


        /*
           Local update
        */

        member.documentStatus =
            "submitted";


        member.documentVerifiedAt =
            {
                seconds:
                    Math.floor(
                        Date.now() /
                        1000
                    )
            };


        /*
           Update count
        */

        updateDocumentCounts();


        /*
           Re-apply filter
        */

        applyCurrentFilter();


        alert(
            `✅ ${memberName}\n\nDocument Verify & Submit ହୋଇଗଲା।`
        );

/* ==================================================
   FORMAT DATE
================================================== */

function formatDate(value){

    if(!value){

        return "-";

    }


    let date;


    if(
        typeof value.toDate ===
        "function"
    ){

        date =
            value.toDate();

    }

    else if(
        typeof value.seconds ===
        "number"
    ){

        date =
            new Date(
                value.seconds *
                1000
            );

    }

    else{

        return "-";

    }


    return date.toLocaleDateString(

        "en-IN",

        {

            day:"2-digit",

            month:"2-digit",

            year:"numeric"

        }

    );

}

/* ==================================================
   COMPRESS IMAGE FOR PRINT
================================================== */

async function compressImageForPrint(
    img
){

    try{

        if(
            !img ||
            !img.src
        ){

            return;

        }


        if(
            img.dataset.printCompressed ===
            "yes"
        ){

            return;

        }


        const response =
            await fetch(

                img.src,

                {

                    mode:"cors",

                    cache:"force-cache"

                }

            );


        if(
            !response.ok
        ){

            return;

        }


        const blob =
            await response.blob();


        const bitmap =
            await createImageBitmap(
                blob
            );


        const MAX_WIDTH = 180;

        const MAX_HEIGHT = 220;


        let width =
            bitmap.width;


        let height =
            bitmap.height;


        const scale =
            Math.min(

                MAX_WIDTH / width,

                MAX_HEIGHT / height,

                1

            );


        width =
            Math.max(

                1,

                Math.round(
                    width * scale
                )

            );


        height =
            Math.max(

                1,

                Math.round(
                    height * scale
                )

            );


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            width;


        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(

            bitmap,

            0,

            0,

            width,

            height

        );


        img.src =
            canvas.toDataURL(

                "image/jpeg",

                0.60

            );


        img.dataset.printCompressed =
            "yes";


        bitmap.close();

    }

    catch(error){

        console.warn(
            "Print compression failed:",
            error
        );

    }

}

        );

                }

            1000
        );

/* ==================================================
   WAIT FOR IMAGES
================================================== */

function waitForImages(){

    const images =
        Array.from(

            document.querySelectorAll(
                "#members .photo img"
            )

        );


    if(
        images.length === 0
    ){

        return Promise.resolve();

    }


    return Promise.all(

        images.map(
            img=>{

                if(
                    img.complete
                ){

                    return Promise.resolve();

                }


                return new Promise(
                    resolve=>{

                        img.onload =
                            resolve;

                        img.onerror =
                            resolve;

                    }
                );

            }
        )

    );

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==================================================
   ESCAPE ATTRIBUTE
================================================== */

function escapeAttribute(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}
