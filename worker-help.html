<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ପ୍ରବାସୀ ଶ୍ରମିକ ସହାୟତା</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="icon" href="logo.png">

<meta name="theme-color" content="#8B0000">


<style>

/* ==================================================
   LANGUAGE
================================================== */

.language-selector{
    position:absolute;
    top:15px;
    right:15px;
    z-index:9999;
}

.language-button{
    background:#fff;
    color:#8B0000;
    border:2px solid #d4af37;
    border-radius:12px;
    padding:9px 13px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.20);
}

.language-menu{
    display:none;
    position:absolute;
    top:48px;
    right:0;
    width:150px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.30);
}

.language-menu.show{
    display:block;
}

.language-menu button{
    width:100%;
    padding:12px;
    border:none;
    background:#fff;
    color:#333;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.language-menu button:hover{
    background:#fff0d0;
}


/* ==================================================
   PAGE
================================================== */

body{
    background:#fffaf0;
    margin:0;
}


/* ==================================================
   HEADER
================================================== */

.help-header{
    position:relative;

    background:
        linear-gradient(
            135deg,
            #8B0000,
            #b30000
        );

    color:white;

    padding:22px 70px 22px 18px;

    display:flex;
    align-items:center;

    gap:15px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.25);
}

.help-logo{
    width:72px;
    height:72px;

    object-fit:contain;

    background:white;

    padding:5px;

    border-radius:50%;
}

.help-header h1{
    margin:0;
    font-size:24px;
}

.help-header p{
    margin:6px 0 0;
    font-size:14px;
}


/* ==================================================
   HERO
================================================== */

.help-hero{

    margin:20px 15px;

    padding:25px 18px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #fff8e8,
            #ffffff
        );

    border:3px solid #d4af37;

    border-radius:22px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);
}

.help-icon{

    width:70px;
    height:70px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#8B0000;

    color:#ffd700;

    font-size:30px;

    box-shadow:
        0 5px 15px
        rgba(139,0,0,.35);
}

.help-hero h2{

    color:#8B0000;

    font-size:27px;

    margin:14px 0 8px;

}

.help-line{

    width:90px;

    height:4px;

    margin:0 auto 15px;

    border-radius:10px;

    background:#d4af37;

}

.help-hero p{

    color:#444;

    font-size:16px;

    line-height:1.8;

    margin:0;

}


/* ==================================================
   FORM CONTAINER
================================================== */

.help-container{

    max-width:650px;

    margin:20px auto 40px;

    padding:0 15px;

}


/* ==================================================
   FORM CARD
================================================== */

.form-card{

    background:white;

    border:2px solid #d4af37;

    border-radius:20px;

    padding:25px 20px;

    box-shadow:
        0 7px 22px
        rgba(0,0,0,.15);
}


/* ==================================================
   FIELD
================================================== */

.form-group{

    margin-bottom:17px;

}

.form-group label{

    display:block;

    color:#8B0000;

    font-weight:bold;

    font-size:16px;

    margin-bottom:7px;

}

.form-group label span{

    color:#d00000;

}

.form-group input,
.form-group select,
.form-group textarea{

    width:100%;

    padding:13px;

    border:2px solid #e2d4a9;

    border-radius:12px;

    font-size:16px;

    background:#fffdf8;

    outline:none;

    font-family:inherit;

}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

    border-color:#8B0000;

    background:white;

}

.form-group textarea{

    min-height:130px;

    resize:vertical;

}


/* ==================================================
   ROW
================================================== */

.form-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}


/* ==================================================
   SUBMIT
================================================== */

.submit-button{

    width:100%;

    border:none;

    padding:15px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #8B0000,
            #c40000
        );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px
        rgba(139,0,0,.30);

}

.submit-button:hover{

    transform:translateY(-1px);

}


/* ==================================================
   NOTE
================================================== */

.form-note{

    margin-top:15px;

    padding:14px;

    background:#fff8e8;

    border:1px solid #d4af37;

    border-radius:12px;

    color:#555;

    font-size:14px;

    line-height:1.7;

}


/* ==================================================
   SUCCESS
================================================== */

#successBox{

    display:none;

    text-align:center;

    background:white;

    border:3px solid #d4af37;

    border-radius:22px;

    padding:30px 20px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);
}

.success-icon{

    width:75px;
    height:75px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#16823b;

    color:white;

    border-radius:50%;

    font-size:35px;

}

#successBox h2{

    color:#16823b;

    font-size:25px;

}

.request-id{

    margin:15px 0;

    padding:15px;

    background:#fff8e8;

    border:2px dashed #d4af37;

    border-radius:14px;

    color:#8B0000;

    font-size:20px;

    font-weight:bold;

}


/* ==================================================
   BUTTON
================================================== */

.secondary-button{

    display:block;

    width:100%;

    padding:13px;

    margin-top:12px;

    border:none;

    border-radius:30px;

    background:#333;

    color:white;

    font-size:16px;

    font-weight:bold;

    text-decoration:none;

    cursor:pointer;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:480px){

    .help-header{

        padding:
            20px
            65px
            20px
            15px;

    }

    .help-logo{

        width:60px;
        height:60px;

    }

    .help-header h1{

        font-size:20px;

    }

    .help-header p{

        font-size:13px;

    }

    .help-hero{

        margin:
            15px 10px;

        padding:
            23px 14px;

    }

    .help-hero h2{

        font-size:24px;

    }

    .form-card{

        padding:
            20px 15px;

    }

    .form-row{

        grid-template-columns:1fr;

        gap:0;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     LANGUAGE SELECTOR
================================================== -->

<div class="language-selector">

<button
    class="language-button"
    onclick="toggleLanguageMenu()">

    🌐
    <span id="currentLanguage">
        ଓଡ଼ିଆ
    </span>
    ▾

</button>


<div
    class="language-menu"
    id="languageMenu">

    <button
        onclick="changeLanguage('or')">

        🇮🇳 ଓଡ଼ିଆ

    </button>


    <button
        onclick="changeLanguage('hi')">

        🇮🇳 हिन्दी

    </button>


    <button
        onclick="changeLanguage('en')">

        🇬🇧 English

    </button>

</div>

</div>


<!-- ==================================================
     HEADER
================================================== -->

<header class="help-header">

<img
    src="logo.png"
    class="help-logo"
    alt="ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ">

<div>

<h1 id="headerTitle">

    ପ୍ରବାସୀ ଓଡ଼ିଆ ଶ୍ରମିକ ସହାୟତା

</h1>

<p id="headerSub">

    ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ • ସୁରତ

</p>

</div>

</header>


<!-- ==================================================
     HERO
================================================== -->

<section class="help-hero">

<div class="help-icon">

<i class="fa-solid fa-hands-helping"></i>

</div>


<h2 id="heroTitle">

    🆘 ସହାୟତା ମାଗନ୍ତୁ

</h2>


<div class="help-line"></div>


<p id="heroText">

    ଆପଣ ବାହାର ରାଜ୍ୟରେ କାମ କରୁଥିବା
    ଓଡ଼ିଆ ଶ୍ରମିକ ହେଲେ ଏବଂ କୌଣସି
    ସମସ୍ୟାରେ ଅଛନ୍ତି, ଆପଣଙ୍କ
    ସମସ୍ୟାର ତଥ୍ୟ ଆମକୁ ପଠାନ୍ତୁ।

</p>

</section>


<!-- ==================================================
     FORM
================================================== -->

<main class="help-container">


<div id="formBox"
     class="form-card">


<form id="workerHelpForm">


<!-- NAME -->

<div class="form-group">

<label>

    👤 ପୂର୍ଣ୍ଣ ନାମ
    <span>*</span>

</label>

<input
    type="text"
    id="name"
    required
    placeholder="ଆପଣଙ୍କ ପୂର୍ଣ୍ଣ ନାମ">

</div>


<!-- MOBILE -->

<div class="form-group">

<label>

    📱 ମୋବାଇଲ୍ ନମ୍ବର
    <span>*</span>

</label>

<input
    type="tel"
    id="mobile"
    required
    maxlength="10"
    pattern="[0-9]{10}"
    placeholder="10 ଅଙ୍କର ମୋବାଇଲ୍ ନମ୍ବର">

</div>


<!-- ROW -->

<div class="form-row">


<!-- DISTRICT -->

<div class="form-group">

<label>

    🏠 ଓଡ଼ିଶା ଜିଲ୍ଲା
    <span>*</span>

</label>

<select id="district" required>

<option value="">
    ଜିଲ୍ଲା ବାଛନ୍ତୁ
</option>

<option>Angul / ଅନୁଗୋଳ</option>
<option>Balangir / ବଲାଙ୍ଗୀର</option>
<option>Balasore / ବାଲେଶ୍ୱର</option>
<option>Bargarh / ବରଗଡ଼</option>
<option>Bhadrak / ଭଦ୍ରକ</option>
<option>Boudh / ବୌଦ୍ଧ</option>
<option>Cuttack / କଟକ</option>
<option>Deogarh / ଦେବଗଡ଼</option>
<option>Dhenkanal
