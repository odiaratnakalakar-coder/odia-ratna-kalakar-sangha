<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts Dashboard</title>

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f2f2f2;
}

h1{
text-align:center;
color:#b00000;
}

.box{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
font-size:20px;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#b00000;
color:white;
}
</style>
</head>

<body>

<h1>📊 Trust Accounts Dashboard</h1>

<div class="box" id="totalMembers">👥 Total Members : 0</div>
<div class="box" id="totalAmount">💰 Total Collection : ₹0</div>
<div class="box" id="totalMembers">👥 Total Members : 0</div>
<div class="box" id="totalAmount">💰 Total Collection : ₹0</div>

<div class="box" id="member500">💵 ₹500 Members : 0</div>
<div class="box" id="member200">💵 ₹200 Members : 0</div>
<div class="box" id="otherAmount">💸 Other Amount Members : 0</div>

<table>
<table>
<thead>
<tr>
<th>ନାମ</th>
<th>ମୋବାଇଲ୍</th>
<th>ରାଶି</th>
<th>Receipt</th>
</tr>
</thead>

<tbody id="memberTable"></tbody>

</table>
<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const table = document.getElementById("memberTable");
const totalMembers = document.getElementById("totalMembers");
const totalAmount = document.getElementById("totalAmount");

let members = 0;
let amount = 0;
let count500 = 0;
let count200 = 0;
let otherCount = 0;
const q = query(
  collection(db,"donations"),
  orderBy("createdAt","desc")
);

const snapshot = await getDocs(q);

snapshot.forEach((doc)=>{

  const data = doc.data();

  members++;
  amount += Number(data.amount || 0);
if (Number(data.amount) === 500) {
  count500++;
} else if (Number(data.amount) === 200) {
  count200++;
} else {
  otherCount++;
  }
  table.innerHTML += `
  <tr>
    <td>${data.name}</td>
    <td>${data.mobile}</td>
    <td>₹${data.amount}</td>
    <td>
      <a href="receipt.html?id=${doc.id}">
        📄 Receipt
      </a>
    </td>
  </tr>
  `;
});

totalMembers.textContent = "👥 Total Members : " + members;
totalAmount.textContent = "💰 Total Collection : ₹" + amount;
  document.getElementById("member500").textContent =
"💵 ₹500 Members : " + count500;

document.getElementById("member200").textContent =
"💵 ₹200 Members : " + count200;

document.getElementById("otherAmount").textContent =
"💸 Other Amount Members : " + otherCount;
</script>
</body>
</html>
