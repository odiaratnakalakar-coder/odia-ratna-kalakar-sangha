<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:95%;
max-width:400px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
text-align:center;
}

.logo{
width:100px;
margin-bottom:15px;
}

h2{
color:#b00000;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#b00000;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#900000;
}

#error{
margin-top:15px;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

<img src="logo.png" class="logo">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<p id="error"></p>

</div>
<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    document.getElementById("error").textContent = "Email ଓ Password ଦିଅନ୍ତୁ";
    return;
  }

  try {

    await signInWithEmailAndPassword(auth, email, password);

    window.location.href = "admin.html";

  } catch (e) {

   document.getElementById("error").textContent = e.code; 
      

  }

});
</script>
</body>
</html>
