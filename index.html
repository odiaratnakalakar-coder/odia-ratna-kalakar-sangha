<!-- Firebase News
     Runs AFTER Homepage becomes visible
-->

<script type="module">

setTimeout(async () => {

    try {

        const { db } = await import("./firebase.js");

        const {
            collection,
            getDocs,
            query,
            orderBy,
            limit
        } = await import(
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
        );


        const notice =
            document.getElementById("noticeBoard");


        const q = query(

            collection(db, "news"),

            orderBy("createdAt", "desc"),

            limit(1)

        );


        const snapshot = await getDocs(q);


        if (snapshot.empty) {

            notice.textContent =
                "📢 କୌଣସି News ନାହିଁ";

            return;

        }


        snapshot.forEach(doc => {

            const news = doc.data();

            notice.textContent =
                `${news.title} - ${news.details}`;

        });


    } catch (error) {

        console.error("News Load Error:", error);

        document.getElementById("noticeBoard").textContent =
            "📢 Latest News";

    }

}, 100);


</script>


<!-- OneSignal
     Loads after Homepage is ready
-->

<script>

setTimeout(() => {

    const script =
        document.createElement("script");

    script.src =
        "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";

    script.defer = true;

    document.head.appendChild(script);


    window.OneSignalDeferred =
        window.OneSignalDeferred || [];


    OneSignalDeferred.push(
        async function(OneSignal) {

            try {

                await OneSignal.init({

                    appId:
                    "9e750c08-3b2d-424f-87a5-c62d08068fcd"

                });

            } catch (error) {

                console.error(
                    "OneSignal Error:",
                    error
                );

            }

        }
    );


}, 1500);

</script>


<!-- Service Worker -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker

                .catch(error => {

                    console.error(
                        "Service Worker Error:",
                        error
                    );

                });

        }
    );

}

</script>
