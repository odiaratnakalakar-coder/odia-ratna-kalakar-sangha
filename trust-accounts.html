<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Accounts | Odia Ratna Kalakar Sangha</title>

    <link rel="stylesheet" href="trust-accounts.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="top-bar">
    <h1>🏦 Trust Accounts</h1>
    <p>ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ - ସୁରତ</p>
</header>

<section class="dashboard">

    <div class="card income">
        <i class="fas fa-arrow-down"></i>
        <h3>Total Income</h3>
        <h2 id="totalIncome">₹0</h2>
    </div>

    <div class="card expense">
        <i class="fas fa-arrow-up"></i>
        <h3>Total Expense</h3>
        <h2 id="totalExpense">₹0</h2>
    </div>

    <div class="card balance">
        <i class="fas fa-wallet"></i>
        <h3>Current Balance</h3>
        <h2 id="currentBalance">₹0</h2>
    </div>

    <div class="card donation">
        <i class="fas fa-hand-holding-heart"></i>
        <h3>Total Donation</h3>
        <h2 id="totalDonation">₹0</h2>
    </div>

</section>

<section class="add-transaction">

    <h2>➕ Add Transaction</h2>

    <form id="transactionForm">

        <input
            type="date"
            id="date"
            required>
<!-- Payment Mode -->

<select id="paymentMode" required>
    <option value="">💳 Payment Mode</option>
    <option value="Cash">Cash</option>
    <option value="UPI">UPI</option>
    <option value="Bank">Bank Transfer</option>
</select>

<!-- Receipt Number -->

<input
    type="text"
    id="receiptNumber"
    placeholder="📄 Receipt Number">

<!-- Collected / Paid By -->

<input
    type="text"
    id="collectedBy"
    placeholder="👤 Collected / Paid By"
    required>

<!-- Member Name -->

<input
    type="text"
    id="memberName"
    placeholder="👤 Member / Donor Name">

<!-- Mobile Number -->

<input
    type="tel"
    id="mobile"
    placeholder="📱 Mobile Number">

<!-- Receipt Photo -->

<label for="receiptPhoto">
    📷 Receipt Photo
</label>

<input
    type="file"
    id="receiptPhoto"
    accept="image/*">

<!-- Notes -->

<textarea
    id="notes"
    rows="3"
    placeholder="📝 Additional Notes"></textarea>
        <select id="type" required>
            <option value="">Select Type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
            <option value="Donation">Donation</option>
            <option value="Membership">Membership Fee</option>
        </select>

        <input
            type="number"
            id="amount"
            placeholder="Amount"
            required>

        <input
            type="text"
            id="description"
            placeholder="Description"
            required>

        <button type="submit">
            Save Transaction
        </button>

    </form>

</section>
<!-- Search & Filter -->

<section class="transaction-tools">

    <h2>📋 Transaction History</h2>

    <div class="tools">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search by Name / Description">

        <select id="filterType">

            <option value="All">All Transactions</option>

            <option value="Income">Income</option>

            <option value="Expense">Expense</option>

            <option value="Donation">Donation</option>

            <option value="Membership">
                Membership Fee
            </option>

        </select>

    </div>

</section>


<!-- Transaction Table -->

<section class="table-section">

    <div id="transactionCards" class="transaction-cards">

        <div class="empty-card">
            No Transactions Found
        </div>

    </div>

</section>

















<!-- Receipt Preview Modal -->
<div id="receiptModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img id="receiptImage" src="" alt="Receipt">
    </div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="trust-accounts.js"></script>

</body>
</html>
