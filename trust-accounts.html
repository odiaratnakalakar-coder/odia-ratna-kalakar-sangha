<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Accounts | ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ ସୁରତ</title>

    <link rel="stylesheet" href="trust-accounts.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
        <div>
            <h2>ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ ସୁରତ</h2>
            <p>Trust Accounts Dashboard</p>
        </div>
    </div>

    <div class="admin">
        <i class="fa-solid fa-user"></i> Admin
    </div>
</header>

<section class="dashboard">

<div class="card income">
<h3>Total Income</h3>
<h2 id="totalIncome">₹0</h2>
</div>

<div class="card expense">
<h3>Total Expense</h3>
<h2 id="totalExpense">₹0</h2>
</div>

<div class="card balance">
<h3>Current Balance</h3>
<h2 id="balance">₹0</h2>
</div>

<div class="card donation">
<h3>Total Donation</h3>
<h2 id="donation">₹0</h2>
</div>

<div class="card members">
<h3>Total Members</h3>
<h2 id="members">0</h2>
</div>

<div class="card today">
<h3>Today's Entry</h3>
<h2 id="todayEntry">0</h2>
</div>

</section>

<section class="transaction-form">

<h2>Add Transaction</h2>

<form id="transactionForm">

<input type="date" id="date">

<select id="type">
<option>Income</option>
<option>Expense</option>
</select>

<select id="category">
<option>Membership Fee</option>
<option>Donation</option>
<option>Office Expense</option>
<option>Medical Help</option>
<option>Event</option>
<option>Other</option>
</select>

<input type="number" placeholder="Amount">

<input type="text" placeholder="Description">

<select>
<option>Cash</option>
<option>UPI</option>
<option>Bank</option>
</select>

<input type="text" placeholder="Collected / Paid By">

<input type="file">
