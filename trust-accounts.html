<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ଟ୍ରଷ୍ଟ ହିସାବ | ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Oriya',sans-serif;
}

body{
background:#f4f7fb;
color:#222;
}

header{
background:linear-gradient(135deg,#ff6b00,#ff9800);
color:#fff;
padding:18px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.2);
}

header h1{
font-size:28px;
margin-bottom:6px;
}

header p{
font-size:15px;
opacity:.95;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
border-radius:15px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card i{
font-size:35px;
margin-bottom:10px;
}

.card h3{
font-size:18px;
margin-bottom:10px;
}

.card h2{
font-size:30px;
font-weight:bold;
}

.income{
border-left:6px solid #28a745;
}

.income i{
color:#28a745;
}

.expense{
border-left:6px solid #dc3545;
}

.expense i{
color:#dc3545;
}

.balance{
border-left:6px solid #007bff;
}

.balance i{
color:#007bff;
}

.section-title{
font-size:22px;
margin:20px 0;
font-weight:bold;
color:#444;
}

</style>
</head>

<body>

<header>

<h1>
<i class="fas fa-landmark"></i>
ଟ୍ରଷ୍ଟ ହିସାବ
</h1>

<p>
ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ
</p>

</header>

<div class="container">

<div class="dashboard">

<div class="card income">

<i class="fas fa-arrow-down"></i>

<h3>ମୋଟ ଆୟ</h3>

<h2 id="totalIncome">₹0</h2>

</div>

<div class="card expense">

<i class="fas fa-arrow-up"></i>

<h3>ମୋଟ ବ୍ୟୟ</h3>

<h2 id="totalExpense">₹0</h2>

</div>

<div class="card balance">

<i class="fas fa-wallet"></i>

<h3>ବର୍ତ୍ତମାନ ବାଲାନ୍ସ</h3>

<h2 id="currentBalance">₹0</h2>

</div>

</div>

<h2 class="section-title">
<i class="fas fa-plus-circle"></i>
ନୂତନ ଟ୍ରାଞ୍ଜାକ୍ସନ୍
</h2>

<!-- <!-- Transaction Form -->

<div class="card" style="margin-bottom:25px;">

<form id="transactionForm">

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;">

<div>
<label>ଟ୍ରାଞ୍ଜାକ୍ସନ୍ ପ୍ରକାର</label>
<select id="type" required>
<option value="">-- ବାଛନ୍ତୁ --</option>
<option value="Income">Income (ଆୟ)</option>
<option value="Expense">Expense (ବ୍ୟୟ)</option>
</select>
</div>

<div>
<label>ରାଶି (₹)</label>
<input type="number" id="amount" placeholder="ଉଦାହରଣ: 1200" required>
</div>

<div>
<label>ତାରିଖ</label>
<input type="date" id="date" required>
</div>

<div>
<label>Payment Mode</label>
<select id="paymentMode">
<option>Cash</option>
<option>UPI</option>
<option>Bank</option>
</select>
</div>

<div style="grid-column:1/-1;">
<label>ବିବରଣୀ</label>
<input type="text" id="description" placeholder="ଉଦାହରଣ: Member Fee / କାର୍ଯ୍ୟକ୍ରମ ଖର୍ଚ୍ଚ" required>
</div>

<div style="grid-column:1/-1;">
<label>ଟିପ୍ପଣୀ</label>
<textarea id="notes" rows="3" placeholder="ଆବଶ୍ୟକ ହେଲେ ଲେଖନ୍ତୁ"></textarea>
</div>

</div>

<br>

<button type="submit"
style="background:#ff9800;color:#fff;border:none;padding:12px 25px;border-radius:8px;font-size:16px;cursor:pointer;">
<i class="fas fa-save"></i> Save Transaction
</button>

</form>

</div>

<h2 class="section-title">
<i class="fas fa-list"></i>
ଟ୍ରାଞ୍ଜାକ୍ସନ୍ ତାଲିକା
</h2>

<div style="overflow-x:auto;">

<table style="width:100%;border-collapse:collapse;background:#fff;">

<thead style="background:#ff9800;color:#fff;">

<tr>
<th style="padding:12px;">ତାରିଖ</th>
<th>ପ୍ରକାର</th>
<th>ବିବରଣୀ</th>
<th>ରାଶି</th>
<th>Mode</th>
<th>Action</th>
</tr>

</thead>

<tbody id="transactionTable">

<tr>
<td colspan="6" style="text-align:center;padding:20px;">
କୌଣସି ଟ୍ରାଞ୍ଜାକ୍ସନ୍ ନାହିଁ
</td>
</tr>

</tbody>

</table>

</div>

</div>
<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const form = document.getElementById("transactionForm");

form.addEventListener("submit", async (e) => {

e.preventDefault();

const type = document.getElementById("type").value;
const amount = Number(document.getElementById("amount").value);
const date = document.getElementById("date").value;
const paymentMode = document.getElementById("paymentMode").value;
const description = document.getElementById("description").value;
const notes = document.getElementById("notes").value;

try{

await addDoc(collection(db,"trustAccounts"),{

type,
amount,
date,
paymentMode,
description,
notes,
createdAt: serverTimestamp()

});

alert("✅ Transaction Saved Successfully");

form.reset();

location.reload();

}catch(error){

alert("Error : " + error.message);

}

});
import {
collection,
addDoc,
serverTimestamp,
getDocs,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
</script>
</body>
</html>
