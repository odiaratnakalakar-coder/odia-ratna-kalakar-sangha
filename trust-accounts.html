<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trust Accounts Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
color:#b00000;
margin-bottom:20px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.box{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
font-size:18px;
font-weight:bold;
}

.section{
background:#fff;
margin-top:20px;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin:15px 0;
font-size:16px;
}

.member,.expense{
padding:12px;
border-bottom:1px solid #ddd;
}

button{
padding:10px 16px;
background:#b00000;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#900000;
}
</style>
</head>

<body>

<div class="container">

    
<h1>📊 Trust Accounts Dashboard</h1>
<div class="summary">

<div class="box">
👥 Total Members<br>
<span id="totalMembers">0</span>
</div>

<div class="box">
💰 Total Collection<br>
₹<span id="totalAmount">0</span>
</div>

<div class="box">
❤️ Total Donation<br>
₹<span id="totalDonation">0</span>
</div>

<div class="box">
💸 Total Expense<br>
₹<span id="totalExpense">0</span>
</div>

<div class="box">
🏦 Current Balance<br>
₹<span id="currentBalance">0</span>
</div>

</div>

<div class="section">
<h2>📅 Date Wise Collection</h2>
<div id="dateList"></div>
</div>

<div class="section">

<input
type="text"
id="searchBox"
placeholder="🔍 ସଦସ୍ୟଙ୍କ ନାମ କିମ୍ବା ମୋବାଇଲ୍ ନମ୍ବର ଖୋଜନ୍ତୁ...">

<h2>👥 Members List</h2>
<div id="memberList"></div>

</div>

<div class="section">
<h2>💸 Expense History</h2>
<div id="expenseList"></div>
</div>

<script type="module">
import { db } from "./firebase.js";

import {
collection,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let members = [];
let donations = [];
let expenses = [];
