body{

.container{
max-width:900px;

h1{

.summary{
display:grid;

.box{
background:#fff;
padding:15px;
border-radius:10px;

#dateList{
display:flex;

}

.date-card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);

background:#fff3f3;
}

#memberList{
margin-top:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.member{
background:white;
padding:10px;
border-radius:10px;
display:flex;
align-items:center;
gap:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.member img{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
border:2px solid green;
}

.info{
flex:1;
}

.receipt{
background:#b00000;
color:white;
padding:8px 15px;
border-radius:6px;
text-decoration:none;
}

</style>
