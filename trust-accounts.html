<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trust Accounts</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
color:#b00000;
margin-bottom:20px;
}

.summary{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:20px;
}

.box{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
font-size:18px;
font-weight:bold;
}

#dateList{
display:flex;
flex-direction:column;
gap:10px;
margin-top:20px;
}

.date-card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
cursor:pointer;
}

.date-card:hover{
background:#fff3f3;
}

#memberList{
margin-top:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.member{
background:white;
padding:10px;
border-radius:10px;
display:flex;
align-items:center;
gap:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.member img{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
border:2px solid green;
}

.info{
flex:1;
}

.receipt{
background:#b00000;
color:white;
padding:8px 15px;
border-radius:6px;
text-decoration:none;
}
.call{
background:#28a745;
color:white;
padding:8px 15px;
border-radius:6px;
text-decoration:none;
display:inline-block;
margin-right:8px;
}
  .whatsapp{
background:#25D366;
color:white;
padding:8px 15px;
border-radius:6px;
text-decoration:none;
display:inline-block;
margin-right:8px;
  }
</style>
</head>

<body>

<div class="container">

<h1>📊 Trust Accounts Dashboard</h1>

<div class="summary">

<div class="box">
👥 Total Members :
<span id="totalMembers">0</span>
</div>

<div class="box">
💰 Total Collection :
₹<span id="totalAmount">0</span>
</div>
<div class="box">
❤️ Total Donation :
₹<span id="totalDonation">0</span>
</div>

<div class="box">
💸 Total Expense :
₹<span id="totalExpense">0</span>
</div>

<div class="box">
🏦 Current Balance :
₹<span id="currentBalance">0</span>
</div>
</div>

<h2>📅 Date Wise Collection</h2>

<div id="dateList"></div>
<input
id="searchBox"
type="text"
placeholder="🔍 ନାମ କିମ୍ବା ମୋବାଇଲ୍ ନମ୍ବର ଖୋଜନ୍ତୁ..."
style="
width:100%;
padding:12px;
margin:15px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
">
<h2 style="margin-top:25px;">👥 Members</h2>

<div id="memberList"></div>
<h2 style="margin-top:25px;">💸 Expense History</h2>

<div id="expenseList"></div>
</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const memberCol = collection(db, "members");
const donationCol = collection(db, "donations");
const expenseCol = collection(db, "expenses");






const dateList = document.getElementById("dateList");
const memberList = document.getElementById("memberList");
const expenseList = document.getElementById("expenseList");
let allMembers = [];

async function loadData() {

  const snap = await getDocs(memberCol);
const donationSnap = await getDocs(donationCol);
const expenseSnap = await getDocs(expenseCol);

let totalDonation = 0;
let totalExpense = 0;

donationSnap.forEach((doc) => {
  const data = doc.data();
  totalDonation += Number(data.amount || 0);
});

expenseSnap.forEach((doc) => {
  const data = doc.data();
  totalExpense += Number(data.amount || 0);
});
  let totalAmount = 0;
  const groups = {};

  snap.forEach((doc) => {

    const data = doc.data();

    allMembers.push(data);

    totalAmount += 1200;

    let date = "Unknown";

    if (data.createdAt) {
      const d = data.createdAt.toDate();
      date = d.toLocaleDateString("en-GB");
    }

    if (!groups[date]) {
      groups[date] = [];
    }

    groups[date].push(data);

  });

  document.getElementById("totalMembers").textContent = allMembers.length;
  document.getElementById("totalAmount").textContent = totalAmount;
document.getElementById("totalDonation").textContent = totalDonation;

document.getElementById("totalExpense").textContent = totalExpense;

document.getElementById("currentBalance").textContent =
totalAmount + totalDonation - totalExpense;
  showDates(groups);

}

function showDates(groups) {

  dateList.innerHTML = "";

  Object.keys(groups).reverse().forEach((date) => {

    const members = groups[date];

    const div = document.createElement("div");

    div.className = "date-card";

    div.innerHTML = `
      <b>📅 ${date}</b><br>
      👥 ${members.length} Members<br>
      💰 ₹${members.length * 1200}
    `;

    div.onclick = () => showMembers(members);

    dateList.appendChild(div);

  });

}

function showMembers(members) {

  memberList.innerHTML = "";

  members.forEach((member) => {

    const card = document.createElement("div");

    card.className = "member";

    card.innerHTML = `
      <img src="${member.photoUrl || 'https://via.placeholder.com/70'}">

      <div class="info">
        <b>👤 ${member.name || ""}</b><br>
        📱 ${member.mobile || ""}<br>
        🆔 ${member.memberId || ""}
      </div>

   <a class="call" href="tel:${member.mobile}">
📞 Call
</a>
<a class="whatsapp"
href="https://wa.me/91${member.mobile}"
target="_blank">
💬 WhatsApp
</a>
<a class="receipt" href="#">
📄 Receipt
</a> 
        
      
    `;

    memberList.appendChild(card);

  });

}
document.getElementById("searchBox").addEventListener("input", (e) => {

const text = e.target.value.toLowerCase();

const result = allMembers.filter(member =>
(member.name || "").toLowerCase().includes(text) ||
(member.mobile || "").includes(text) ||
(member.memberId || "").toLowerCase().includes(text)
);

showMembers(result);

});
loadData();
</script>
</body>

  alert("❌ Wrong Password");
  window.location.href = "index.html";
}
  </script>
</html>
