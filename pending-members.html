<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Members</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#111;
color:#fff;
font-family:Arial,sans-serif;
margin:0;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
text-align:center;
color:#ffcc00;
margin-bottom:20px;
}

.member-card{
background:#222;
border:2px solid #c40000;
border-radius:10px;
padding:15px;
margin-bottom:15px;
}

.member-card img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
display:block;
margin:auto;
}

.member-card h3{
text-align:center;
margin:10px 0;
}

.member-card p{
margin:6px 0;
}

.actions{
display:flex;
gap:10px;
margin-top:12px;
}

.actions button{
flex:1;
padding:10px;
border:none;
border-radius:6px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.approve{
background:green;
color:white;
}

.reject{
background:red;
color:white;
}
</style>

</head>

<body>

<div class="container">

<h1>🕒 Pending Members</h1>

<div id="memberList">

</div>
<script type="module" src="pending-members.js"></script>

</body>
</html>
