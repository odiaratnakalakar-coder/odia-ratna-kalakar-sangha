<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ସଦସ୍ୟ ତାଲିକା</title>

<link rel="stylesheet" href="style.css">

<style>
.container{
    max-width:900px;
    margin:20px auto;
    padding:20px;
}

h2{
    text-align:center;
    color:#fff;
}

#search{
    width:100%;
    padding:12px;
    margin:15px 0;
    border-radius:8px;
    border:none;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#b30000;
    color:#fff;
}

button{
    background:#b30000;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}#memberCountBox{
    background:#b30000;
    color:#fff;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}
    /* Popup */
#memberModal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
z-index:9999;
}

.modal-box{
background:#fff;
width:90%;
max-width:420px;
margin:40px auto;
padding:20px;
border-radius:15px;
position:relative;
}

.close-btn{
position:absolute;
right:15px;
top:10px;
font-size:28px;
cursor:pointer;
}

.modal-photo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #00695c;
display:block;
margin:auto;
}

.action-btn{
flex:1;
text-decoration:none;
padding:12px;
border-radius:10px;
text-align:center;
font-weight:bold;
color:#fff;
}

.call-btn{
background:#0d6efd;
}

.wa-btn{
background:#25D366;
}
</style>

</head>

<body>

<div class="container">

<h2>ସଦସ୍ୟ ତାଲିକା</h2>

<div id="memberCountBox">
👥 ମୋଟ ସଦସ୍ୟ: <span id="totalMembers">0</span> ଜଣ
</div>

<input
type="text"
id="search"
placeholder="ନାମ କିମ୍ବା Member ID ଖୋଜନ୍ତୁ">

<table>

<thead>

<tr>
<th>Member ID</th>
<th>ନାମ</th>
<th>ମୋବାଇଲ୍</th>
<th>ID Card</th>
<th>Delete</th>

</thead>

<tbody id="memberTable">

</tbody>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




const table = document.getElementById("memberTable");
const search = document.getElementById("search");

let members = [];

async function loadMembers(){

const querySnapshot = await getDocs(collection(db,"members"));

members = [];

querySnapshot.forEach((doc)=>{

members.push({
docId: doc.id,
...doc.data()
});

});



document.getElementById("totalMembers").innerText = members.length;

showMembers(members);

    

}

function showMembers(list){

table.innerHTML="";

list.forEach(member=>{

table.innerHTML += `
<tr>

<td>${member.memberId||""}</td>

<td>${member.name||""}</td>

<td>${member.mobile||""}</td>

<td>

<button onclick="viewMember('${member.docId}')">
View
</button>





</td>
<td>
<button onclick="deleteMember('${member.docId}')">
Delete
</button>
</td>
</tr>
`;

});

}
search.addEventListener("keyup", ()=>{

const value = search.value.toLowerCase();

const filtered = members.filter(member =>

(member.name || "").toLowerCase().includes(value) ||

(member.memberId || "").toLowerCase().includes(value)

);

showMembers(filtered);

});
window.deleteMember = async function(id) {

  const password = prompt("🔒 Delete Password ଦିଅନ୍ତୁ");

  if (password !== "2026@") {
    alert("❌ ଭୁଲ Password");
    return;
  }

  if (!confirm("ଏହି Member କୁ Delete କରିବେ?")) return;

  await deleteDoc(doc(db, "members", id));

  alert("✅ Member Deleted Successfully");

  loadMembers();
};

loadMembers();
  



};

  

  

  



</script>

</body>

</html>
