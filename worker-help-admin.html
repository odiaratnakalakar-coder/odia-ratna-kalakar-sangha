/* ==================================================
   RESET
================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* ==================================================
   BODY
================================================== */

body{

    background:#111;

    color:white;

    padding:15px;

}


/* ==================================================
   CONTAINER
================================================== */

.container{

    max-width:700px;

    margin:auto;

}


/* ==================================================
   HEADER
================================================== */

.header{

    background:
    linear-gradient(
        135deg,
        #8B0000,
        #c40000
    );

    border:2px solid #ffcc00;

    border-radius:18px;

    padding:20px;

    text-align:center;

    margin-bottom:20px;

    box-shadow:
    0 5px 20px
    rgba(255,0,0,.25);

}


.header img{

    width:70px;

    height:70px;

    object-fit:contain;

    border-radius:50%;

    background:white;

    padding:4px;

    margin-bottom:8px;

}


.header h1{

    color:#fff;

    font-size:24px;

    margin-bottom:7px;

}


.header p{

    color:#ffeaa7;

    font-size:14px;

}


/* ==================================================
   TOP BAR
================================================== */

.topBar{

    display:flex;

    gap:10px;

    margin-bottom:20px;

}


.topButton{

    flex:1;

    display:block;

    text-decoration:none;

    border:none;

    padding:13px 10px;

    border-radius:10px;

    background:#c40000;

    color:white;

    text-align:center;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


.topButton:hover{

    background:#ff0000;

}


/* ==================================================
   COUNT
================================================== */

.countCard{

    background:#222;

    border:2px solid #ffcc00;

    border-radius:15px;

    padding:18px;

    text-align:center;

    margin-bottom:20px;

}


.countCard h2{

    color:#ffcc00;

    font-size:32px;

    margin-bottom:5px;

}


.countCard p{

    color:#ddd;

}


/* ==================================================
   REQUEST CARD
================================================== */

.requestCard{

    background:#222;

    border:2px solid #c40000;

    border-radius:16px;

    padding:18px;

    margin-bottom:18px;

    box-shadow:
    0 5px 15px
    rgba(255,0,0,.20);

}


/* ==================================================
   REQUEST HEADER
================================================== */

.requestHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

}


.requestNumber{

    color:#ffcc00;

    font-size:20px;

    font-weight:bold;

}


.status{

    padding:7px 12px;

    border-radius:20px;

    background:#16823b;

    color:white;

    font-size:13px;

    font-weight:bold;

}


/* ==================================================
   REQUEST ID
================================================== */

.requestId{

    background:#fff8e8;

    color:#8B0000;

    border:2px dashed #d4af37;

    border-radius:10px;

    padding:12px;

    text-align:center;

    font-weight:bold;

    font-size:18px;

    margin-bottom:15px;

    word-break:break-word;

}


/* ==================================================
   DETAILS
================================================== */

.detail{

    background:#151515;

    border-radius:9px;

    padding:10px;

    margin-top:8px;

    line-height:1.6;

    word-break:break-word;

}


.detail strong{

    color:#ffcc00;

}


.detail a{

    color:#7ec8ff;

    text-decoration:none;

}


.detail a:hover{

    text-decoration:underline;

}


/* ==================================================
   PROBLEM
================================================== */

.problem{

    margin-top:12px;

    background:#fff8e8;

    color:#333;

    border-left:5px solid #c40000;

    border-radius:10px;

    padding:14px;

    line-height:1.7;

}


.problem strong{

    color:#8B0000;

}


/* ==================================================
   ACTIONS
================================================== */

.actions{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;

    margin-top:15px;

}


.actionButton{

    border:none;

    border-radius:9px;

    padding:12px;

    color:white;

    font-weight:bold;

    cursor:pointer;

    font-size:14px;

}


.callButton{

    background:#16823b;

}


.callButton:hover{

    background:#1da34d;

}


.deleteButton{

    background:#8B0000;

}


.deleteButton:hover{

    background:#d00000;

}


/* ==================================================
   EMPTY
================================================== */

.empty{

    background:#222;

    border:2px solid #555;

    border-radius:15px;

    padding:30px 20px;

    text-align:center;

    color:#aaa;

}


.emptyIcon{

    font-size:45px;

    margin-bottom:10px;

}


/* ==================================================
   LOADING
================================================== */

.loading{

    text-align:center;

    padding:30px;

    color:#ffcc00;

    font-size:17px;

}


/* ==================================================
   FOOTER
================================================== */

.footer{

    text-align:center;

    color:#777;

    font-size:13px;

    margin:30px 0 15px;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:480px){

    body{

        padding:10px;

    }

    .header{

        padding:18px 12px;

    }

    .header h1{

        font-size:21px;

    }

    .topButton{

        font-size:13px;

        padding:12px 7px;

    }

    .requestCard{

        padding:14px;

    }

}

</style>

</head>
