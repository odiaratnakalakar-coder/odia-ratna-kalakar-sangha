<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ସଦସ୍ୟ ପଞ୍ଜୀକରଣ</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<img src="logo.png" class="logo" alt="Logo">

<h2>ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</h2>

<form id="registrationForm">

<label>ପୂର୍ଣ୍ଣ ନାମ</label>
<input type="text" id="name" required>

<label>ପିତାଙ୍କ ନାମ</label>
<input type="text" id="father" required>

<label>ମୋବାଇଲ୍ ନମ୍ବର</label>
<input type="tel" id="mobile" required>
<label>🎂 ଜନ୍ମ ତାରିଖ (DD/MM/YYYY)</label>
<input
  type="text"
  id="dob"
  placeholder="ଉଦାହରଣ: 07/03/1989"
  pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}"
  required>
<label>ଠିକଣା</label>
<textarea id="address" rows="3" required></textarea>

<label>ପାସପୋର୍ଟ ସାଇଜ ଫଟୋ</label>
<input type="file" id="photo" accept="image/*" required>
<h3 style="color:red;">💳 Membership Fee : ₹1200</h3>

<p>ନିମ୍ନରେ ଥିବା QR Code ସ୍କାନ୍ କରି ₹1200 ପେମେଣ୍ଟ କରନ୍ତୁ।</p>

<img src="paytm-qr.jpg" width="250" style="display:block;margin:auto;">

<p><b>UPI ID:</b> 9827275681@pthdfc</p>

<div class="notice" style="background:#fff3cd;color:#856404;padding:12px;border-radius:8px;margin:15px 0;">
<b>⚠️ ସୂଚନା</b><br>
ଆପଣଙ୍କ Registration ପ୍ରଥମେ <b>Pending</b> ରେ ଯିବ।<br>
Admin Approval ପରେ Payment Verify କରାଯିବ ଏବଂ Member ID ଦିଆଯିବ।
</div>





<button type="submit">
📝 Registration Submit
</button>



</form>

</div>
<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  doc,
  getDoc,
  setDoc,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
  

async function getNextMemberId() {
  const counterRef = doc(db, "system", "counter");
  const counterSnap = await getDoc(counterRef);

  let number = 1;

  if (counterSnap.exists()) {
    number = counterSnap.data().lastNumber + 1;
  }

  await setDoc(counterRef, {
    lastNumber: number
  });

  return "ORKS" + String(number).padStart(4, "0");
}

document.getElementById("registrationForm").addEventListener("submit", async (e) => {

  e.preventDefault();

  try {

    const memberId = await getNextMemberId();
const mobile = document.getElementById("mobile").value.trim();

const q = query(
  collection(db, "members"),
  where("mobile", "==", mobile)
);

const snapshot = await getDocs(q);

if (!snapshot.empty) {
  alert("ଏହି ମୋବାଇଲ ନମ୍ବରରେ ପୂର୍ବରୁ Registration ହୋଇସାରିଛି।");
  return;
}
    const photo = document.getElementById("photo").files[0];

    let photoUrl = "";

    if (photo) {

      const formData = new FormData();

      formData.append("file", photo);
      formData.append("upload_preset", "odiaratan2026");

      const response = await fetch(
        "https://api.cloudinary.com/v1_1/y8toswrt/image/upload",
        {
          method: "POST",
          body: formData
        }
      );

      const result = await response.json();

      photoUrl = result.secure_url;
    }    const docRef = await addDoc(collection(db, "members"), {
      memberId: memberId,
photoUrl: photoUrl,
name: document.getElementById("name").value,
father: document.getElementById("father").value,
mobile: document.getElementById("mobile").value,
address: document.getElementById("address").value,

status: "pending",
paid: false,

paymentMode: "",
txnId: "",

createdAt: new Date()
      
    
      
      
      
      

      
    });

    

    alert("ଆପଣଙ୍କ Registration ସଫଳତାର ସହ Submit ହୋଇଛି। Admin Approval ପରେ Member ID ଦିଆଯିବ।");

document.getElementById("registrationForm").reset();

  } catch (error) {
    alert("Error: " + error.message);
    console.error(error);
  }

});

</script>

</body>
</html>
