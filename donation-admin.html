<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Donation Admin</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
}


/* =====================================================
   TITLE
===================================================== */

h1{
text-align:center;
color:#ff9800;
margin-bottom:20px;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary{
background:#222;
border:2px solid #ff9800;
border-radius:12px;
padding:20px;
text-align:center;
margin-bottom:20px;
}

.summary h2{
font-size:30px;
color:#ffcc00;
margin-bottom:8px;
}

.summary p{
font-size:16px;
}


/* =====================================================
   DONATION CARD
===================================================== */

.card{
background:#222;
border:2px solid #ff9800;
border-radius:12px;
padding:15px;
margin-bottom:15px;
}

.card h3{
color:#ffcc00;
margin-bottom:10px;
font-size:21px;
}

.card p{
margin:7px 0;
font-size:16px;
word-break:break-word;
}


/* =====================================================
   BUTTON
===================================================== */

button{
padding:10px 15px;
border:none;
border-radius:7px;
cursor:pointer;
color:#fff;
font-size:15px;
margin:5px 3px;
}

button:active{
transform:scale(.97);
}


/* =====================================================
   WHATSAPP
===================================================== */

.whatsappBtn{
background:#25D366;
color:#fff;
font-weight:bold;
}


/* =====================================================
   EDIT
===================================================== */

.editBtn{
background:#2196F3;
}


/* =====================================================
   DELETE
===================================================== */

.deleteBtn{
background:#c40000;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:450px){

button{
font-size:14px;
padding:10px 12px;
}

.card h3{
font-size:20px;
}

.card p{
font-size:16px;
}

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     TITLE
===================================================== -->

<h1>
❤️ Donation Admin
</h1>


<!-- =====================================================
     TOTAL DONATION
===================================================== -->

<div class="summary">

<h2 id="totalAmount">
₹0
</h2>

<p>
Total Donation Amount
</p>

</div>


<!-- =====================================================
     DONATION LIST
===================================================== -->

<div id="donationList"></div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import { db } from "./firebase.js";

import {

collection,
getDocs,
getDoc,
updateDoc,
deleteDoc,
doc,
query,
orderBy

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   ELEMENTS
===================================================== */

const donationList =
document.getElementById("donationList");

const totalAmount =
document.getElementById("totalAmount");


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDonationDate(createdAt){

if(!createdAt){

return new Date().toLocaleDateString(
"en-IN"
);

}


try{

let date;


if(
createdAt &&
typeof createdAt.toDate === "function"
){

date =
createdAt.toDate();

}


else if(
createdAt &&
createdAt.seconds
){

date =
new Date(
createdAt.seconds * 1000
);

}


else{

date =
new Date(createdAt);

}


return date.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


catch(error){

return new Date().toLocaleDateString(
"en-IN"
);

}

}


/* =====================================================
   LOAD DONATIONS
===================================================== */

async function loadDonations(){

donationList.innerHTML="";

let total=0;


try{


/* QUERY */

const q =
query(
collection(db,"donations"),
orderBy("createdAt","desc")
);


/* GET DATA */

const snapshot =
await getDocs(q);


/* EMPTY */

if(snapshot.empty){

donationList.innerHTML = `

<div class="card">

<p style="text-align:center;">
କୌଣସି Donation ମିଳିଲା ନାହିଁ।
</p>

</div>

`;

totalAmount.textContent =
"₹0";

return;

}


/* =====================================================
   CREATE CARDS
===================================================== */

snapshot.forEach((item)=>{


const data =
item.data();


const name =
data.name || "-";


const mobile =
data.mobile || "-";


const amount =
Number(data.amount || 0);


const purpose =
data.purpose || "-";


/* TOTAL */

total += amount;


/* =====================================================
   CARD HTML
===================================================== */

donationList.innerHTML += `

<div class="card">


<h3>
❤️ ${escapeHTML(name)}
</h3>


<p>
📱 ${escapeHTML(mobile)}
</p>


<p>
💰 ₹${amount}
</p>


<p>
📝 ${escapeHTML(purpose)}
</p>


<!-- WHATSAPP -->

<button
class="whatsappBtn"
data-id="${item.id}">

🙏 WhatsApp Thank You

</button>


<!-- EDIT -->

<button
class="editBtn"
data-id="${item.id}">

✏️ Edit

</button>


<!-- DELETE -->

<button
class="deleteBtn"
data-id="${item.id}">

🗑️ Delete

</button>


</div>

`;

});


/* =====================================================
   TOTAL
===================================================== */

totalAmount.textContent =
"₹" + total;


/* =====================================================
   BUTTON EVENTS
===================================================== */


/* EDIT BUTTONS */

document
.querySelectorAll(".editBtn")
.forEach(button=>{

button.addEventListener(
"click",
function(){

editDonation(
this.dataset.id
);

});

});


/* DELETE BUTTONS */

document
.querySelectorAll(".deleteBtn")
.forEach(button=>{

button.addEventListener(
"click",
function(){

deleteDonation(
this.dataset.id
);

});

});


/* WHATSAPP BUTTONS */

document
.querySelectorAll(".whatsappBtn")
.forEach(button=>{

button.addEventListener(
"click",
function(){

whatsappThankYou(
this.dataset.id
);

});

});


}


catch(error){

console.error(
"Donation Load Error:",
error
);


donationList.innerHTML = `

<div class="card">

<p>
❌ Donation load ହୋଇପାରିଲା ନାହିଁ।
</p>

<p style="font-size:13px;">
${escapeHTML(error.message)}
</p>

</div>

`;

}

}


/* =====================================================
   EDIT DONATION
===================================================== */

async function editDonation(id){

try{


/* GET DOCUMENT */

const donationRef =
doc(
db,
"donations",
id
);


const donationSnap =
await getDoc(
donationRef
);


/* CHECK */

if(!donationSnap.exists()){

alert(
"❌ Donation ମିଳିଲା ନାହିଁ।"
);

return;

}


/* DATA */

const data =
donationSnap.data();


/* OLD VALUES */

const oldName =
data.name || "";


const oldMobile =
data.mobile || "";


const oldAmount =
data.amount || "";


const oldPurpose =
data.purpose || "";


/* =====================================================
   NEW NAME
===================================================== */

const newName =
prompt(
"👤 ନୂଆ ନାମ",
oldName
);


if(newName === null){

return;

}


/* =====================================================
   NEW MOBILE
===================================================== */

const newMobile =
prompt(
"📱 ନୂଆ ମୋବାଇଲ୍",
oldMobile
);


if(newMobile === null){

return;

}


/* =====================================================
   NEW AMOUNT
===================================================== */

const newAmount =
prompt(
"💰 ନୂଆ ରାଶି",
oldAmount
);


if(newAmount === null){

return;

}


/* =====================================================
   NEW PURPOSE
===================================================== */

const newPurpose =
prompt(
"📝 ନୂଆ ଉଦ୍ଦେଶ୍ୟ",
oldPurpose
);


if(newPurpose === null){

return;

}


/* =====================================================
   VALIDATION
===================================================== */

if(
newName.trim()==="" ||
newMobile.trim()==="" ||
newAmount.trim()===""
){

alert(
"❌ Name, Mobile ଓ Amount ଖାଲି ରଖନ୍ତୁ ନାହିଁ।"
);

return;

}


/* AMOUNT */

const amountNumber =
Number(newAmount);


if(
isNaN(amountNumber) ||
amountNumber < 0
){

alert(
"❌ Donation Amount ଠିକ୍ ନୁହେଁ।"
);

return;

}


/* =====================================================
   UPDATE
===================================================== */

await updateDoc(

donationRef,

{

name:
newName.trim(),

mobile:
newMobile.trim(),

amount:
amountNumber,

purpose:
newPurpose.trim()

}

);


/* SUCCESS */

alert(
"✅ Donation Successfully Updated"
);


/* RELOAD */

await loadDonations();


}


catch(error){

console.error(
"Edit Error:",
error
);


alert(
"❌ Edit କରିବାରେ ସମସ୍ୟା ହେଲା।\n\n" +
error.message
);

}

}


/* =====================================================
   DELETE DONATION
===================================================== */

async function deleteDonation(id){

try{


/* PASSWORD */

const password =
prompt(
"🔒 Delete Password"
);


if(password !== "2026@"){

alert(
"❌ ଭୁଲ Password"
);

return;

}


/* CONFIRM */

const confirmDelete =
confirm(
"⚠️ ଏହି Donation କୁ Delete କରିବେ?"
);


if(!confirmDelete){

return;

}


/* DELETE */

await deleteDoc(
doc(
db,
"donations",
id
)
);


/* SUCCESS */

alert(
"✅ Donation Deleted"
);


/* RELOAD */

await loadDonations();


}


catch(error){

console.error(
"Delete Error:",
error
);


alert(
"❌ Delete କରିବାରେ ସମସ୍ୟା ହେଲା।\n\n" +
error.message
);

}

}


/* =====================================================
   WHATSAPP THANK YOU
===================================================== */

async function whatsappThankYou(id){

try{


/* GET DONATION */

const donationRef =
doc(
db,
"donations",
id
);


const donationSnap =
await getDoc(
donationRef
);


/* CHECK */

if(!donationSnap.exists()){

alert(
"❌ Donation data ମିଳିଲା ନାହିଁ।"
);

return;

}


/* DATA */

const data =
donationSnap.data();


/* =====================================================
   MEMBER NAME
===================================================== */

const name =
data.name ||
"ସଦସ୍ୟ";


/* =====================================================
   AMOUNT
===================================================== */

const amount =
Number(
data.amount || 0
);


/* =====================================================
   MOBILE
===================================================== */

let mobile =
String(
data.mobile || ""
)
.replace(
/\D/g,
""
);


/* =====================================================
   INDIAN NUMBER FIX
===================================================== */


/*
   10 digit:
   8401319341

   becomes:

   918401319341
*/


if(
mobile.length === 10
){

mobile =
"91" + mobile;

}


/*
   0XXXXXXXXXX

   becomes:

   91XXXXXXXXXX
*/

else if(
mobile.length === 11 &&
mobile.startsWith("0")
){

mobile =
"91" +
mobile.substring(1);

}


/*
   Already 91XXXXXXXXXX
*/

else if(
mobile.length === 12 &&
mobile.startsWith("91")
){

mobile =
mobile;

}


/*
   +91XXXXXXXXXX

   '+' already removed
   above
*/


/* =====================================================
   FINAL VALIDATION
===================================================== */

if(
mobile.length !== 12 ||
!mobile.startsWith("91")
){

alert(
"❌ Mobile Number ଠିକ୍ ନୁହେଁ।\n\n" +
"Firestore ରେ 10 digit Indian mobile number ରଖନ୍ତୁ।"
);

return;

}


/* =====================================================
   DATE
===================================================== */

const date =
formatDonationDate(
data.createdAt
);


/* =====================================================
   FINAL WHATSAPP MESSAGE
===================================================== */

const message =

`ଜୟଜଗନ୍ନାଥ 🙏

🙏 ଧନ୍ୟବାଦ ${name} ଜୀ 🙏

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ ସୁରତକୁ ଆପଣ ₹${amount} Donation କରିଥିବାରୁ ହୃଦୟରୁ ଅନେକ ଅନେକ ଧନ୍ୟବାଦ। ❤️

📅 ତାରିଖ: ${date}
💰 Donation: ₹${amount}

ଆପଣଙ୍କର ଏହି ସହଯୋଗ ଆମ ସଂଘର କଳା, ସଂସ୍କୃତି ଓ ସମାଜସେବାମୂଳକ କାର୍ଯ୍ୟକୁ ଆହୁରି ଶକ୍ତି ଦେବ।

ଆପଣଙ୍କ ସହଯୋଗ — ଆମର ଶକ୍ତି। 🙏
ଆମ ସଂସ୍କୃତି — ଆମର ପରିଚୟ। ❤️

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ ସୁରତ`;


/* =====================================================
   WHATSAPP URL
===================================================== */

const whatsappURL =

"https://wa.me/" +
mobile +
"?text=" +
encodeURIComponent(
message
);


/* =====================================================
   OPEN WHATSAPP
===================================================== */

window.location.href =
whatsappURL;


}


catch(error){

console.error(
"WhatsApp Error:",
error
);


alert(
"❌ WhatsApp message ତିଆରି କରିବାରେ ସମସ୍ୟା ହେଲା।\n\n" +
error.message
);

}

}


/* =====================================================
   START
===================================================== */

loadDonations();


</script>


</div>


</body>

</html>
