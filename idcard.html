<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ସଦସ୍ୟ ID Card</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#f3f3f3;
    font-family:Arial,sans-serif;
    padding:15px;
}

/* ================= MEMBER LIST ================= */

#memberListPage{
    max-width:600px;
    margin:auto;
}

.pageTitle{
    text-align:center;
    color:#b30000;
    margin-bottom:15px;
    font-size:24px;
}

.searchBox{
    width:100%;
    padding:12px;
    border:2px solid #b30000;
    border-radius:8px;
    font-size:16px;
    margin-bottom:15px;
    outline:none;
}

.memberItem{
    background:#fff;
    border:1px solid #ddd;
    border-left:5px solid #b30000;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.memberName{
    font-size:17px;
    font-weight:bold;
    color:#222;
    margin-bottom:5px;
}

.memberInfo{
    font-size:13px;
    color:#555;
    line-height:1.6;
}

.idButton{
    width:100%;
    margin-top:8px;
    padding:10px;
    background:#c00000;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
}

.idButton:active{
    background:#900000;
}

.noMember{
    text-align:center;
    color:#777;
    padding:20px;
}

/* ================= ID CARD ================= */

#cardPage{
    display:none;
    flex-direction:column;
    align-items:center;
}

.card{
    width:54mm;
    min-height:85.6mm;
    background:#fff;
    border:1.5px solid #b30000;
    border-radius:3mm;
    overflow:hidden;
    position:relative;
}

/* ================= HEADER ================= */

.header{
    text-align:center;
    padding:3px 4px 4px;
    border-bottom:1px solid #b30000;
}

.logo{
    width:38px;
    height:38px;
    object-fit:contain;
    display:block;
    margin:0 auto 1px;
}

.header h1{
    color:#b30000;
    font-size:11px;
    font-weight:bold;
    line-height:1.15;
    margin:1px 0;
}

.header h2{
    color:#16458f;
    font-size:7px;
    font-weight:bold;
    margin:1px 0;
}

.header p{
    color:#555;
    font-size:7px;
    margin:1px 0;
}

/* ================= PHOTO ================= */

.photo{
    text-align:center;
    margin:4px 0 3px;
}

/* IMPORTANT:
   Photo crop ହେବ ନାହିଁ
*/

.photo img{
    width:30mm;
    height:39mm;

    object-fit:cover;
    object-position:center 25%;

    background:#f2f2f2;

    border:1px solid #b30000;
    border-radius:3mm;

    display:block;
    margin:auto;
}



    

    
    

    

    
    

    
    


/* ================= DETAILS ================= */

.details{
    padding:0 4px;
}

.detail{
    display:flex;
    align-items:flex-start;
    border-bottom:1px dashed #ddd;
    padding:2px 0;
    min-height:16px;
}

.label{
    width:28%;
    flex-shrink:0;
    color:#b30000;
    font-size:7px;
    font-weight:bold;
}

.value{
    width:72%;
    color:#222;
    font-size:7px;
    font-weight:600;
    line-height:1.25;
    word-break:break-word;
}

/* ================= BOTTOM ================= */

.bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 5px 5px;
    gap:4px;
}

.qrBox{
    width:45px;
    min-width:45px;
    text-align:center;
}

#qrcode{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
}

#qrcode canvas,
#qrcode img{
    width:45px !important;
    height:45px !important;
}

.verify{
    flex:1;
    color:#b30000;
    font-size:6px;
    font-weight:bold;
    text-align:center;
}

.seal{
    width:38px;
    height:38px;
    min-width:38px;
    border:1px dashed #b30000;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#b30000;
    font-size:6px;
    font-weight:bold;
}

/* ================= BUTTONS ================= */

.buttonRow{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.printBtn,
.backBtn{
    padding:10px 15px;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
}

.printBtn{
    background:#c00000;
}

.backBtn{
    background:#444;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* ================= PRINT ================= */

@media print {

    @page {
        size: 54mm 85.6mm;
        margin: 0;
    }

    html,
    body {
        width: 54mm !important;
        height: 85.6mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
    }

    #memberListPage,
    .buttonRow {
        display: none !important;
    }

    #cardPage {
        display: block !important;
        width: 54mm !important;
        height: 85.6mm !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .card {
        width: 54mm !important;
        height: 85.6mm !important;
        min-height: 85.6mm !important;
        margin: 0 !important;
        padding: 0 !important;
        border-radius: 3mm !important;
        overflow: hidden !important;
        box-shadow: none !important;
    }

    .photo {
        margin: 3px 0 2px !important;
    }

    .photo img {
        width: 30mm !important;
        height: 34mm !important;
    }

    .detail {
        min-height: 14px !important;
        padding: 1.5px 0 !important;
    }

    .label,
    .value {
        font-size: 6.5px !important;
    }

    .bottom {
        padding: 3px 4px 3px !important;
    }

    .qrBox,
    #qrcode {
        width: 40px !important;
        height: 40px !important;
    }

    #qrcode canvas,
    #qrcode img {
        width: 40px !important;
        height: 40px !important;
    }

    .seal {
        width: 34px !important;
        height: 34px !important;
        min-width: 34px !important;
        font-size: 5.5px !important;
    }

    .verify {
        font-size: 5.5px !important;
    }

}

<body>


<!-- ================================================= -->
<!-- MEMBER LIST PAGE -->
<!-- ================================================= -->

<div id="memberListPage">

    <h1 class="pageTitle">
        🪪 Member ID Card
    </h1>

    <input
        type="text"
        id="searchBox"
        class="searchBox"
        placeholder="🔍 ନାମ / Mobile / Member ID ଖୋଜନ୍ତୁ..."
    >

    <div id="memberList">

        <div class="loading">
            Members loading...
        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- ID CARD PAGE -->
<!-- ================================================= -->

<div id="cardPage">

<div class="card">

    <!-- HEADER -->

    <div class="header">

        <img
            class="logo"
            src="logo.png"
            alt="Logo"
        >

        <h1>ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</h1>

        <h2>ODIA RATNA KALAKAR SANGHA</h2>

        <p>Surat, Gujarat</p>

    </div>


    <!-- PHOTO -->

    <div class="photo">

        <img
            id="photo"
            src="logo.png"
            alt="Member Photo"
        >

    </div>


    <!-- MEMBER DETAILS -->

    <div class="details">

        <div class="detail">

            <div class="label">
                Member ID:
            </div>

            <div class="value" id="memberId">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ନାମ:
            </div>

            <div class="value" id="name">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ପିତାଙ୍କ ନାମ:
            </div>

            <div class="value" id="father">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ଜନ୍ମ ତାରିଖ:
            </div>

            <div class="value" id="dob">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ମୋବାଇଲ:
            </div>

            <div class="value" id="mobile">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ଠିକଣା:
            </div>

            <div class="value" id="address">
                -
            </div>

        </div>

    </div>


    <!-- QR + VERIFY + SEAL -->

    <div class="bottom">

        <div class="qrBox">

            <div id="qrcode"></div>

        </div>


        <div class="verify">

            Scan to Verify

        </div>


        <div class="seal">

            OFFICIAL

        </div>

    </div>

</div>


<!-- BUTTONS -->

<div class="buttonRow">

    <button
        class="backBtn"
        onclick="showMemberList()"
    >
        ← Back
    </button>

    <button
        class="printBtn"
        onclick="window.print()"
    >
        🖨️ Print
    </button>

</div>


</div>


<!-- ================================================= -->
<!-- QR CODE -->
<!-- ================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================================================= */
/* VARIABLES */
/* ================================================= */

let allMembers = [];


/* ================================================= */
/* LOAD MEMBERS */
/* ================================================= */

async function loadMembers(){

    try{

        const snap =
            await getDocs(
                collection(db,"members")
            );


        allMembers = [];


        snap.forEach(item => {

            allMembers.push({

                id:item.id,

                ...item.data()

            });

        });


        displayMembers(allMembers);

    }

    catch(error){

        console.error(error);

        document.getElementById("memberList").innerHTML =

            `<div class="noMember">
                ❌ Members load ହେଲା ନାହିଁ
             </div>`;

    }

}


/* ================================================= */
/* DISPLAY MEMBERS */
/* ================================================= */

function displayMembers(members){

    const list =
        document.getElementById("memberList");


    list.innerHTML = "";


    if(members.length === 0){

        list.innerHTML =
            `<div class="noMember">
                ❌ Member ମିଳିଲା ନାହିଁ
             </div>`;

        return;

    }


    members.forEach(member => {


        const name =
            member.name || "ନାମ ନାହିଁ";


        const memberId =
            member.memberId || member.id;


        const mobile =
            member.mobile || "";


        const div =
            document.createElement("div");


        div.className =
            "memberItem";


        div.innerHTML = `

            <div class="memberName">
                👤 ${escapeHTML(name)}
            </div>

            <div class="memberInfo">
                🪪 Member ID: ${escapeHTML(memberId)}
                <br>
                📱 Mobile: ${escapeHTML(mobile)}
            </div>

            <button
                class="idButton"
                data-id="${member.id}"
            >
                🪪 View ID Card
            </button>

        `;


        div.querySelector(".idButton")
            .addEventListener(
                "click",
                function(){

                    openIDCard(member.id);

                }
            );


        list.appendChild(div);

    });

}


/* ================================================= */
/* SEARCH */
/* ================================================= */

document
.getElementById("searchBox")
.addEventListener(
    "input",
    function(){

        const search =
            this.value
            .trim()
            .toLowerCase();


        if(!search){

            displayMembers(allMembers);

            return;

        }


        const filtered =
            allMembers.filter(member => {

                const name =
                    String(
                        member.name || ""
                    ).toLowerCase();


                const mobile =
                    String(
                        member.mobile || ""
                    ).toLowerCase();


                const memberId =
                    String(
                        member.memberId || ""
                    ).toLowerCase();


                return (

                    name.includes(search) ||

                    mobile.includes(search) ||

                    memberId.includes(search)

                );

            });


        displayMembers(filtered);

    }
);


/* ================================================= */
/* OPEN ID CARD */
/* ================================================= */

function openIDCard(id){

    history.pushState(
        {},
        "",
        "idcard.html?id=" +
        encodeURIComponent(id)
    );


    document
        .getElementById("memberListPage")
        .style.display = "none";


    document
        .getElementById("cardPage")
        .style.display = "flex";


    loadMember(id);

}


/* ================================================= */
/* LOAD MEMBER */
/* ================================================= */

async function loadMember(id){

    try{

        const memberRef =
            doc(db,"members",id);


        const memberSnap =
            await getDoc(memberRef);


        if(!memberSnap.exists()){

            alert("Member ମିଳିଲା ନାହିଁ");

            showMemberList();

            return;

        }


        const data =
            memberSnap.data();


        /* MEMBER ID */

        document
            .getElementById("memberId")
            .textContent =
                data.memberId || id;


        /* NAME */

        document
            .getElementById("name")
            .textContent =
                data.name || "-";


        /* FATHER */

        document
            .getElementById("father")
            .textContent =
                data.father || "-";


        /* DOB */

        document
            .getElementById("dob")
            .textContent =
                data.dob || "-";


        /* MOBILE */

        document
            .getElementById("mobile")
            .textContent =
                data.mobile || "-";


        /* ADDRESS */

        document
            .getElementById("address")
            .textContent =
                data.address || "-";


        /* ================================================= */
        /* PHOTO */
        /* ================================================= */

        const photo =
            document.getElementById("photo");


        const photoURL =
            data.photoUrl ||
            data.photoURL ||
            data.imageUrl ||
            data.photo ||
            data.image ||
            data.profilePhoto ||
            data.profileImage ||
            "";


        if(photoURL){

            photo.src = photoURL;

            photo.onerror = function(){

                console.warn(
                    "Photo load failed:",
                    photoURL
                );

                this.src = "logo.png";

            };

        }
        else{

            photo.src = "logo.png";

        }


        /* ================================================= */
        /* VERIFY URL */
        /* ================================================= */

        const verifyURL =
            window.location.origin +
            window.location.pathname
                .replace(
                    "idcard.html",
                    "view-id.html"
                ) +
            "?id=" +
            encodeURIComponent(id);


        /* CLEAR QR */

        document
            .getElementById("qrcode")
            .innerHTML = "";


        /* QR */

        new QRCode(

            document.getElementById("qrcode"),

            {
                text:verifyURL,

                width:200,

                height:200,

                correctLevel:
                    QRCode.CorrectLevel.M
            }

        );

    }

    catch(error){

        console.error(error);

        alert(
            "Error: " +
            error.message
        );

    }

}


/* ================================================= */
/* BACK TO MEMBER LIST */
/* ================================================= */

window.showMemberList = function(){

    history.pushState(
        {},
        "",
        "idcard.html"
    );


    document
        .getElementById("cardPage")
        .style.display = "none";


    document
        .getElementById("memberListPage")
        .style.display = "block";


    document
        .getElementById("qrcode")
        .innerHTML = "";

};


/* ================================================= */
/* HTML SECURITY */
/* ================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================================================= */
/* URL ID CHECK */
/* ================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const urlID =
    params.get("id");


if(urlID){

    document
        .getElementById("memberListPage")
        .style.display = "none";


    document
        .getElementById("cardPage")
        .style.display = "flex";


    loadMember(urlID);

}
else{

    loadMembers();

}

</script>

</body>

</html>
