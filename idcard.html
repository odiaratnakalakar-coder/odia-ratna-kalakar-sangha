<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ସଦସ୍ୟ ID Card</title>


<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    background:#f3f3f3;

    font-family:Arial,sans-serif;

    padding:15px;

}


/* =====================================================
   MEMBER LIST PAGE
===================================================== */

#memberListPage{

    max-width:600px;

    margin:auto;

}


.pageTitle{

    text-align:center;

    color:#b30000;

    margin-bottom:15px;

    font-size:24px;

}


.searchBox{

    width:100%;

    padding:12px;

    border:2px solid #b30000;

    border-radius:8px;

    font-size:16px;

    margin-bottom:15px;

    outline:none;

}


.searchBox:focus{

    border-color:#700000;

}


.memberItem{

    background:#fff;

    border:1px solid #ddd;

    border-left:5px solid #b30000;

    border-radius:8px;

    padding:12px;

    margin-bottom:10px;

    box-shadow:0 2px 6px rgba(0,0,0,.1);

}


.memberName{

    font-size:17px;

    font-weight:bold;

    color:#222;

    margin-bottom:5px;

}


.memberInfo{

    font-size:13px;

    color:#555;

    line-height:1.6;

}


.idButton{

    width:100%;

    margin-top:8px;

    padding:10px;

    background:#c00000;

    color:#fff;

    border:none;

    border-radius:6px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


.idButton:hover{

    background:#900000;

}


.noMember{

    text-align:center;

    color:#777;

    padding:20px;

}


.loading{

    text-align:center;

    padding:30px;

    color:#777;

}


/* =====================================================
   CARD PAGE
===================================================== */

#cardPage{

    display:none;

    flex-direction:column;

    align-items:center;

}


/* =====================================================
   ID CARD
===================================================== */

.card{

    width:54mm;

    height:85.6mm;

    background:#fff;

    border:1.5px solid #b30000;

    border-radius:3mm;

    overflow:hidden;

    position:relative;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    text-align:center;

    padding:3px 4px 4px;

    border-bottom:1px solid #b30000;

}


.logo{

    width:38px;

    height:38px;

    object-fit:contain;

    display:block;

    margin:0 auto 1px;

}


.header h1{

    color:#b30000;

    font-size:11px;

    font-weight:bold;

    line-height:1.15;

    margin:1px 0;

}


.header h2{

    color:#16458f;

    font-size:7px;

    font-weight:bold;

    margin:1px 0;

}


.header p{

    color:#555;

    font-size:7px;

    margin:1px 0;

}


/* =====================================================
   PHOTO
===================================================== */

.photo{

    text-align:center;

    margin:4px 0 3px;

}


.photo img{

    width:30mm;

    height:34mm;

    object-fit:cover;

    object-position:center 25%;

    background:#f2f2f2;

    border:1px solid #b30000;

    border-radius:3mm;

    display:block;

    margin:auto;

}


/* =====================================================
   DETAILS
===================================================== */

.details{

    padding:0 4px;

}


.detail{

    display:flex;

    align-items:flex-start;

    border-bottom:1px dashed #ddd;

    padding:2px 0;

    min-height:16px;

}


.label{

    width:30%;

    flex-shrink:0;

    color:#b30000;

    font-size:7px;

    font-weight:bold;

}


.value{

    width:70%;

    color:#222;

    font-size:7px;

    font-weight:600;

    line-height:1.25;

    word-break:break-word;

}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:3px 5px 4px;

    gap:4px;

}


.qrBox{

    width:38px;

    min-width:38px;

    text-align:center;

}


#qrcode{

    width:38px;

    height:38px;

    display:flex;

    align-items:center;

    justify-content:center;

}


#qrcode canvas,
#qrcode img{

    width:38px !important;

    height:38px !important;

}


.verify{

    flex:1;

    color:#b30000;

    font-size:6px;

    font-weight:bold;

    text-align:center;

}


.seal{

    width:34px;

    height:34px;

    min-width:34px;

    border:1px dashed #b30000;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#b30000;

    font-size:5px;

    font-weight:bold;

}


/* =====================================================
   BUTTONS
===================================================== */

.buttonRow{

    display:flex;

    gap:8px;

    margin-top:15px;

}


.printBtn,
.backBtn{

    padding:10px 15px;

    color:#fff;

    border:none;

    border-radius:8px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


.printBtn{

    background:#c00000;

}


.backBtn{

    background:#444;

}


/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{

        size:54mm 85.6mm;

        margin:0;

    }


    html,
    body{

        width:54mm !important;

        height:85.6mm !important;

        margin:0 !important;

        padding:0 !important;

        background:#fff !important;

    }


    #memberListPage,
    .buttonRow{

        display:none !important;

    }


    #cardPage{

        display:block !important;

        width:54mm !important;

        height:85.6mm !important;

        margin:0 !important;

        padding:0 !important;

    }


    .card{

        width:54mm !important;

        height:85.6mm !important;

        min-height:85.6mm !important;

        margin:0 !important;

        padding:0 !important;

        border-radius:3mm !important;

        overflow:hidden !important;

        box-shadow:none !important;

    }


    .photo{

        margin:3px 0 2px !important;

    }


    .photo img{

        width:30mm !important;

        height:34mm !important;

    }


    .detail{

        min-height:14px !important;

        padding:1.5px 0 !important;

    }


    .label,
    .value{

        font-size:6.5px !important;

    }


    .bottom{

        padding:0 4px 0 !important;

        margin-top:-2px !important;

    }


    .qrBox,
    #qrcode{

        width:32px !important;

        height:32px !important;

    }


    #qrcode canvas,
    #qrcode img{

        width:32px !important;

        height:32px !important;

    }


    .seal{

        width:30px !important;

        height:30px !important;

        min-width:30px !important;

        font-size:5px !important;

    }


    .verify{

        font-size:5px !important;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MEMBER LIST
===================================================== -->

<div id="memberListPage">


    <h1 class="pageTitle">

        🪪 Member ID Card

    </h1>


    <input
        type="text"
        id="searchBox"
        class="searchBox"
        placeholder="🔍 ନାମ / Mobile / Member ID ଖୋଜନ୍ତୁ..."
        autocomplete="off"
    >


    <div id="memberList">

        <div class="loading">

            ⏳ Approved Members Loading...

        </div>

    </div>

</div>



<!-- =====================================================
     CARD PAGE
===================================================== -->

<div id="cardPage">


    <div class="card">


        <!-- HEADER -->

        <div class="header">


            <img
                class="logo"
                src="logo.png"
                alt="Logo"
            >


            <h1>

                ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ

            </h1>


            <h2>

                ODIA RATNA KALAKAR SANGHA

            </h2>


            <p>

                Surat, Gujarat

            </p>


        </div>



        <!-- PHOTO -->

        <div class="photo">


            <img
                id="photo"
                src="logo.png"
                alt="Member Photo"
            >


        </div>



        <!-- DETAILS -->

        <div class="details">


            <div class="detail">

                <div class="label">
                    Member ID:
                </div>

                <div
                    class="value"
                    id="memberId"
                >
                    -
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    ନାମ:
                </div>

                <div
                    class="value"
                    id="name"
                >
                    -
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    ପିତାଙ୍କ ନାମ:
                </div>

                <div
                    class="value"
                    id="father"
                >
                    -
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    ଜନ୍ମ ତାରିଖ:
                </div>

                <div
                    class="value"
                    id="dob"
                >
                    -
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    ମୋବାଇଲ:
                </div>

                <div
                    class="value"
                    id="mobile"
                >
                    -
                </div>

            </div>


            <div class="detail">

                <div class="label">
                    ଠିକଣା:
                </div>

                <div
                    class="value"
                    id="address"
                >
                    -
                </div>

            </div>


        </div>



        <!-- QR -->

        <div class="bottom">


            <div class="qrBox">

                <div id="qrcode"></div>

            </div>


            <div class="verify">

                Scan to Verify

            </div>


            <div class="seal">

                OFFICIAL

            </div>


        </div>


    </div>



    <!-- BUTTONS -->

    <div class="buttonRow">


        <button
            class="backBtn"
            onclick="showMemberList()"
        >

            ← Back

        </button>


        <button
            class="printBtn"
            onclick="window.print()"
        >

            🖨️ Print

        </button>


    </div>


</div>



<!-- =====================================================
     QR CODE LIBRARY
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


import { db } from "./firebase.js";


import {

    collection,
    getDocs,
    doc,
    getDoc

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =====================================================
   VARIABLES
===================================================== */

let allMembers = [];



/* =====================================================
   APPROVAL CHECK
===================================================== */

function isApproved(member){

    const approval =
        String(
            member.approval ?? ""
        )
        .trim()
        .toLowerCase();


    /*
       NEW SYSTEM
    */

    if(
        approval === "approved"
    ){

        return true;

    }


    /*
       OLD APPROVED DATA
       ONLY IF NEW approval FIELD
       DOES NOT EXIST
    */

    if(
        !member.hasOwnProperty("approval") &&
        member.approved === true
    ){

        return true;

    }


    if(
        !member.hasOwnProperty("approval") &&

        String(
            member.status ?? ""
        )
        .trim()
        .toLowerCase()
        === "approved"
    ){

        return true;

    }


    return false;

}



/* =====================================================
   LOAD APPROVED MEMBERS
===================================================== */

async function loadMembers(){

    const list =
        document.getElementById(
            "memberList"
        );


    list.innerHTML = `

        <div class="loading">

            ⏳ Approved Members Loading...

        </div>

    `;


    try{


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "members"
                )
            );


        allMembers = [];


        snapshot.forEach(
        docSnap => {


            const data =
                docSnap.data();


            /*
               ONLY APPROVED
            */

            if(
                !isApproved(data)
            ){

                return;

            }


            /*
               ADD MEMBER
            */

            allMembers.push({

                id:
                    docSnap.id,

                ...data

            });

        });


        /*
           A → Z
        */

        allMembers.sort(
        (a,b) => {

            return String(
                a.name || ""
            )
            .localeCompare(
                String(
                    b.name || ""
                ),
                "or",
                {
                    sensitivity:"base"
                }
            );

        });


        displayMembers(
            allMembers
        );

    }

    catch(error){

        console.error(
            "ID Card loading error:",
            error
        );


        list.innerHTML = `

            <div class="noMember">

                ❌ Members Load ହୋଇପାରିଲା ନାହିଁ।

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}



/* =====================================================
   DISPLAY MEMBERS
===================================================== */

function displayMembers(members){

    const list =
        document.getElementById(
            "memberList"
        );


    list.innerHTML = "";


    if(
        members.length === 0
    ){

        list.innerHTML = `

            <div class="noMember">

                ❌ କୌଣସି Approved Member ମିଳିଲା ନାହିଁ।

            </div>

        `;

        return;

    }


    members.forEach(
    member => {


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "memberItem";


        item.innerHTML = `

            <div class="memberName">

                👤 ${escapeHTML(
                    member.name ||
                    "ନାମ ନାହିଁ"
                )}

            </div>


            <div class="memberInfo">

                🪪 Member ID:

                ${escapeHTML(
                    member.memberId ||
                    "-"
                )}

                <br>

                📱 Mobile:

                ${escapeHTML(
                    member.mobile ||
                    "-"
                )}

            </div>


            <button
                type="button"
                class="idButton"
            >

                🪪 View ID Card

            </button>

        `;


        item
        .querySelector(
            ".idButton"
        )
        .addEventListener(
            "click",
            function(){

                openIDCard(
                    member.id
                );

            }
        );


        list.appendChild(
            item
        );

    });

}



/* =====================================================
   SEARCH
===================================================== */

document
.getElementById(
    "searchBox"
)
.addEventListener(
"input",
function(){

    const value =
        this.value
        .trim()
        .toLowerCase();


    if(!value){

        displayMembers(
            allMembers
        );

        return;

    }


    const filtered =
        allMembers.filter(
        member => {


            const name =
                String(
                    member.name || ""
                )
                .toLowerCase();


            const mobile =
                String(
                    member.mobile || ""
                )
                .toLowerCase();


            const memberId =
                String(
                    member.memberId || ""
                )
                .toLowerCase();


            return (

                name.includes(value) ||

                mobile.includes(value) ||

                memberId.includes(value)

            );

        }
        );


    displayMembers(
        filtered
    );

});



/* =====================================================
   OPEN ID CARD
===================================================== */

async function openIDCard(id){

    try{


        const memberRef =
            doc(
                db,
                "members",
                id
            );


        const memberSnap =
            await getDoc(
                memberRef
            );


        if(
            !memberSnap.exists()
        ){

            alert(
                "❌ Member ମିଳିଲା ନାହିଁ।"
            );

            return;

        }


        const member =
            memberSnap.data();


        /*
           FINAL APPROVAL CHECK
        */

        if(
            !isApproved(member)
        ){

            alert(
                "⛔ ଏହି Member ଏପର୍ଯ୍ୟନ୍ତ Approve ହୋଇନାହାନ୍ତି।"
            );

            return;

        }


        /*
           OPEN CARD
        */

        history.pushState(
            {},
            "",
            "idcard.html?id=" +
            encodeURIComponent(id)
        );


        document
        .getElementById(
            "memberListPage"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "cardPage"
        )
        .style.display =
            "flex";


        await loadMember(
            id
        );

    }

    catch(error){

        console.error(error);

        alert(
            "❌ ID Card open error:\n\n" +
            error.message
        );

    }

}



/* =====================================================
   LOAD SINGLE MEMBER
===================================================== */

async function loadMember(id){

    try{


        const memberRef =
            doc(
                db,
                "members",
                id
            );


        const memberSnap =
            await getDoc(
                memberRef
            );


        if(
            !memberSnap.exists()
        ){

            alert(
                "❌ Member ମିଳିଲା ନାହିଁ।"
            );

            showMemberList();

            return;

        }


        const data =
            memberSnap.data();


        /*
           FINAL SECURITY CHECK
        */

        if(
            !isApproved(data)
        ){

            alert(
                "⛔ ଏହି Member ଏପର୍ଯ୍ୟନ୍ତ Approve ହୋଇନାହାନ୍ତି।"
            );

            showMemberList();

            return;

        }


        /* =============================================
           MEMBER ID
        ============================================= */

        document
        .getElementById(
            "memberId"
        )
        .textContent =

            data.memberId ||
            "-";


        /* =============================================
           NAME
        ============================================= */

        document
        .getElementById(
            "name"
        )
        .textContent =

            data.name ||
            "-";


        /* =============================================
           FATHER
        ============================================= */

        document
        .getElementById(
            "father"
        )
        .textContent =

            data.father ||
            "-";


        /* =============================================
           DOB
        ============================================= */

        document
        .getElementById(
            "dob"
        )
        .textContent =

            data.dob ||
            "-";


        /* =============================================
           MOBILE
        ============================================= */

        document
        .getElementById(
            "mobile"
        )
        .textContent =

            data.mobile ||
            "-";


        /* =============================================
           ADDRESS
        ============================================= */

        document
        .getElementById(
            "address"
        )
        .textContent =

            data.address ||
            "-";


        /* =============================================
           PHOTO
        ============================================= */

        const photo =
            document.getElementById(
                "photo"
            );


        const photoURL =

            data.photoUrl ||

            data.photoURL ||

            data.imageUrl ||

            data.photo ||

            data.image ||

            data.profilePhoto ||

            data.profileImage ||

            "";


        photo.onerror =
        function(){

            this.onerror = null;

            this.src =
                "logo.png";

        };


        photo.src =
            photoURL ||
            "logo.png";


        /* =============================================
           QR VERIFY URL
        ============================================= */

        const verifyURL =

            window.location.origin +

            window.location.pathname
            .replace(
                "idcard.html",
                "view-id.html"
            ) +

            "?id=" +

            encodeURIComponent(
                id
            );


        /* =============================================
           CLEAR OLD QR
        ============================================= */

        const qr =
            document.getElementById(
                "qrcode"
            );


        qr.innerHTML = "";


        /* =============================================
           CREATE QR
        ============================================= */

        if(
            typeof QRCode !==
            "undefined"
        ){

            new QRCode(
                qr,
                {

                    text:
                        verifyURL,

                    width:
                        200,

                    height:
                        200,

                    correctLevel:
                        QRCode.CorrectLevel.M

                }
            );

        }
        else{

            qr.innerHTML =
                "QR Error";

        }

    }

    catch(error){

        console.error(
            "Load Member Error:",
            error
        );


        alert(
            "❌ Error:\n\n" +
            error.message
        );

    }

}



/* =====================================================
   BACK
===================================================== */

window.showMemberList =
function(){

    history.pushState(
        {},
        "",
        "idcard.html"
    );


    document
    .getElementById(
        "cardPage"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "memberListPage"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "qrcode"
    )
    .innerHTML =
        "";

};



/* =====================================================
   BROWSER BACK BUTTON
===================================================== */

window.addEventListener(
"popstate",
function(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    if(id){

        document
        .getElementById(
            "memberListPage"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "cardPage"
        )
        .style.display =
            "flex";


        loadMember(
            id
        );

    }
    else{

        document
        .getElementById(
            "cardPage"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "memberListPage"
        )
        .style.display =
            "block";

    }

});



/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   DIRECT URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const urlID =
    params.get("id");


if(urlID){

    document
    .getElementById(
        "memberListPage"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "cardPage"
    )
    .style.display =
        "flex";


    loadMember(
        urlID
    );

}
else{

    loadMembers();

}


console.log(
    "✅ Final ID Card System Loaded"
);

</script>


</body>

</html>
