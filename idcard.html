<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ସଦସ୍ୟ ID Card</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f2f2;
display:flex;
justify-content:center;
padding:20px;
}

.card{
    
    width:85.6mm;
    height:54mm;
    background:#fff;

    
    background:#fff;
    border:1.5px solid #b30000;
    border-radius:3mm;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.20);
    position:relative;
}
    
    
    
    
    
    
    
}
.header{
    text-align:center;
    background:#fff;
    padding:4px 6px;
    border-bottom:1px solid #b30000;
    }
    
    
    
    
}

.logo{
    width:32px;
    height:32px;
    object-fit:contain;
    margin:2px auto;
}
    
    
    


.header h2{
    color:#b30000;
    font-size:11px;
    margin:2px 0;
    font-weight:bold;
}
    
    
    
    


.header p{
    color:#003399;
    font-size:7px;
    font-weight:bold;
    margin:1px 0;
}
    
    
    

.photo{
    text-align:center;
    margin:3px 0;
}
    
 .photo img{
    width:22mm;
    height:28mm;
    object-fit:cover;
    border:1px solid #b30000;
    border-radius:2mm;
 }   



    
    
    
    


    
    
    
    
    
    


    
    
    
























.header p{
font-size:14px;
color:#555;
margin-top:3px;
}

.photo{
text-align:center;
margin:15px 0;
}

.photo img{
width:140px;
height:170px;
border:4px solid #b30000;
border-radius:10px;
object-fit:cover;
}

.details{
    padding:4px 8px;
}
    


.details p{
    margin:3px 0;
    padding-bottom:3px;
    border-bottom:1px dashed #ddd;
    font-size:11px;
    line-height:1.3;
}
    
    
    
    
    

.details strong{
    color:#b30000;
    display:inline-block;
    min-width:70px;
}
    
    
    
                              
    
    
    


.details span{
    color:#222;
    font-weight:600;
}








  .footer{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:15px 20px;
    border-top:1px dashed #ccc;
}

.sign{
    font-size:12px;
    text-align:center;
    color:#444;
}

.seal{
    width:70px;
    height:70px;
    border:2px dashed #b30000;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#b30000;
    font-size:12px;
    text-align:center;
}





}

.sign{
text-align:center;
font-size:12px;
}













.printBtn{
width:90%;
margin:15px auto;
display:block;
padding:12px;
font-size:18px;
background:#b30000;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

@media print{

@page{
    size:54mm 85.6mm;
    margin:0;
}

html,body{
    width:54mm;
    height:85.6mm;
    margin:0;
    padding:0;
    background:#fff;
}

.card{
    width:54mm;
    height:85.6mm;
    min-height:85.6mm;
    margin:0;
    border:1px solid #b30000;
    border-radius:0;
    box-shadow:none;
    overflow:hidden;
}

.printBtn{
    display:none;
}

}













</style>
</head>

<body>

<div class="card">

<div class="header">
    <img src="logo.png" class="logo">

    <h2>ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</h2>
    <p>ODIA RATNA KALAKAR SANGHA</p>
    <small>Surat, Gujarat</small>
</div>

<div class="photo">
    <img id="photo" src="">
</div>

<div class="details">

    <p><strong>Member ID :</strong>
        <span id="memberId"></span>
    </p>

    <p><strong>ନାମ :</strong>
        <span id="name"></span>
    </p>

    <p><strong>ପିତାଙ୍କ ନାମ :</strong>
        <span id="father"></span>
    </p>
<p><strong>ଜନ୍ମ ତାରିଖ :</strong>
    <span id="dob"></span>
</p>
    <p><strong>ମୋବାଇଲ :</strong>
        <span id="mobile"></span>
    </p>

    <p><strong>ଠିକଣା :</strong>
        <span id="address"></span>
    </p>

</div>
<div id="qrcode" style="text-align:center; margin:15px 0;">
</div>
<p style="text-align:center;font-size:12px;color:#b30000;">
Scan to Verify
</p>
<div class="footer">

    <img src="signature.png" style="width:120px;height:auto;"><br>
Authorized Signature
        
    

    <div class="seal">
        Official Seal
    </div>

</div>






























<button class="printBtn" onclick="window.print()">
🖨️ Print ID Card
</button>



<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script type="module">

import { db } from "./firebase.js";

import { doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(id){

const snap = await getDoc(doc(db,"members",id));

if(snap.exists()){

const data = snap.data();

document.getElementById("memberId").textContent = data.memberId || "";
document.getElementById("name").textContent = data.name || "";
document.getElementById("father").textContent = data.father || "";
  document.getElementById("dob").textContent = data.dob || "";  
document.getElementById("mobile").textContent = data.mobile || "";
document.getElementById("address").textContent = data.address || "";

if(data.photoUrl){
document.getElementById("photo").src = data.photoUrl;
}

const verifyUrl =
window.location.origin +
window.location.pathname.replace("idcard.html","view-id.html") +
"?id=" + id;
QRCode.toCanvas(
  verifyUrl,
  { width: 100 },
  function (error, canvas) {
    if (!error) {
      document.getElementById("qrcode").appendChild(canvas);
    }
  }
);
}else{
alert("Member Not Found");
}

}else{
alert("Invalid ID");
}

</script>

</body>
</html>
