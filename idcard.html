<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ସଦସ୍ୟ ID Card</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#f3f3f3;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
}

/* ================= CARD ================= */

.card{
    width:54mm;
    min-height:85.6mm;
    background:#fff;
    border:1.5px solid #b30000;
    border-radius:3mm;
    overflow:hidden;
    position:relative;
}

/* ================= HEADER ================= */

.header{
    text-align:center;
    padding:3px 4px 4px;
    border-bottom:1px solid #b30000;
}

.logo{
    width:38px;
    height:38px;
    object-fit:contain;
    display:block;
    margin:0 auto 1px;
}

.header h1{
    color:#b30000;
    font-size:11px;
    font-weight:bold;
    line-height:1.15;
    margin:1px 0;
}

.header h2{
    color:#16458f;
    font-size:7px;
    font-weight:bold;
    margin:1px 0;
}

.header p{
    color:#555;
    font-size:7px;
    margin:1px 0;
}

/* ================= PHOTO ================= */

.photo{
    text-align:center;
    margin:4px 0 3px;
}

.photo img{
    width:29mm;
    height:32mm;
    object-fit:cover;
    border:1px solid #b30000;
    border-radius:3mm;
}

/* ================= DETAILS ================= */

.details{
    padding:0 4px;
}

.detail{
    display:flex;
    align-items:flex-start;
    border-bottom:1px dashed #ddd;
    padding:2px 0;
    min-height:16px;
}

.label{
    width:28%;
    flex-shrink:0;
    color:#b30000;
    font-size:7px;
    font-weight:bold;
}

.value{
    width:72%;
    color:#222;
    font-size:7px;
    font-weight:600;
    line-height:1.25;
    word-break:break-word;
}

/* ================= BOTTOM ================= */

.bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 5px 5px;
    gap:4px;
}

.qrBox{
    width:45px;
    min-width:45px;
    text-align:center;
}

#qrcode{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
}

#qrcode canvas,
#qrcode img{
    width:45px !important;
    height:45px !important;
}

.verify{
    flex:1;
    color:#b30000;
    font-size:6px;
    font-weight:bold;
    text-align:center;
}

.seal{
    width:38px;
    height:38px;
    min-width:38px;
    border:1px dashed #b30000;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#b30000;
    font-size:6px;
    font-weight:bold;
}

/* ================= PRINT BUTTON ================= */

.printBtn{
    width:180px;
    margin-top:15px;
    padding:10px;
    background:#c00000;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

/* ================= PRINT ================= */

@media print{

    @page{
        size:54mm 85.6mm;
        margin:0;
    }

    html,
    body{
        width:54mm;
        height:85.6mm;
        margin:0;
        padding:0;
        background:#fff;
    }

    .card{
        width:54mm;
        min-height:85.6mm;
        height:85.6mm;
        margin:0;
        border-radius:0;
        box-shadow:none;
    }

    .printBtn{
        display:none;
    }
}

</style>

</head>

<body>


<!-- ================= ID CARD ================= -->

<div class="card">

    <!-- HEADER -->

    <div class="header">

        <img
            class="logo"
            src="logo.png"
            alt="Logo"
        >

        <h1>ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</h1>

        <h2>ODIA RATNA KALAKAR SANGHA</h2>

        <p>Surat, Gujarat</p>

    </div>


    <!-- PHOTO -->

    <div class="photo">

        <img
            id="photo"
            src=""
            alt="Member Photo"
        >

    </div>


    <!-- MEMBER DETAILS -->

    <div class="details">

        <div class="detail">

            <div class="label">
                Member ID:
            </div>

            <div class="value" id="memberId">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ନାମ:
            </div>

            <div class="value" id="name">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ପିତାଙ୍କ ନାମ:
            </div>

            <div class="value" id="father">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ଜନ୍ମ ତାରିଖ:
            </div>

            <div class="value" id="dob">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ମୋବାଇଲ:
            </div>

            <div class="value" id="mobile">
                -
            </div>

        </div>


        <div class="detail">

            <div class="label">
                ଠିକଣା:
            </div>

            <div class="value" id="address">
                -
            </div>

        </div>

    </div>


    <!-- QR + VERIFY + SEAL -->

    <div class="bottom">

        <div class="qrBox">

            <div id="qrcode"></div>

        </div>


        <div class="verify">

            Scan to Verify

        </div>


        <div class="seal">

            OFFICIAL

        </div>

    </div>

</div>


<!-- PRINT -->

<button
    class="printBtn"
    onclick="window.print()"
>
    🖨️ Print ID Card
</button>


<!-- QR CODE LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<!-- FIREBASE -->

<script type="module">

import { db } from "./firebase.js";

import {
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ================= GET MEMBER ID ================= */

const params =
    new URLSearchParams(window.location.search);

const id =
    params.get("id");


if(!id){

    alert("Member ID ମିଳିଲା ନାହିଁ");

}else{

    loadMember(id);

}



/* ================= LOAD MEMBER ================= */

async function loadMember(id){

    try{

        const memberRef =
            doc(db,"members",id);

        const memberSnap =
            await getDoc(memberRef);


        if(!memberSnap.exists()){

            alert("Member ମିଳିଲା ନାହିଁ");

            return;

        }


        const data =
            memberSnap.data();


        /* MEMBER DATA */

        document.getElementById("memberId").textContent =
            data.memberId || id;


        document.getElementById("name").textContent =
            data.name || "";


        document.getElementById("father").textContent =
            data.father || "";


        document.getElementById("dob").textContent =
            data.dob || "";


        document.getElementById("mobile").textContent =
            data.mobile || "";


        document.getElementById("address").textContent =
            data.address || "";


        /* PHOTO */

        const photo =
            document.getElementById("photo");


        const photoURL =
            data.photoUrl ||
            data.photo ||
            data.image ||
            "";


        if(photoURL){

            photo.src = photoURL;

        }


        /* ================= VERIFY URL ================= */

        const verifyURL =
            window.location.origin +
            window.location.pathname.replace(
                "idcard.html",
                "view-id.html"
            ) +
            "?id=" +
            encodeURIComponent(id);


        /* CLEAR OLD QR */

        document.getElementById("qrcode").innerHTML = "";


        /* ================= QR ================= */

        new QRCode(
            document.getElementById("qrcode"),
            {
                text:verifyURL,
                width:200,
                height:200,
                correctLevel:QRCode.CorrectLevel.M
            }
        );


    }

    catch(error){

        console.error(error);

        alert(
            "Error: " +
            error.message
        );

    }

}

</script>

</body>

    </html>
