<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ - Gallery</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
padding:15px;
}

h2{
text-align:center;
margin-bottom:20px;
color:#ffcc00;
}

#gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
}

.card{
background:#222;
border:2px solid #c40000;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 8px rgba(255,0,0,.3);
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img,
.card iframe{
width:100%;
height:200px;
display:block;
border:none;
object-fit:cover;
background:#000;
}

.card h3{
padding:10px;
font-size:16px;
text-align:center;
}

#preview{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
z-index:999;
}

#preview img{
max-width:95%;
max-height:95%;
border-radius:10px;
}
</style>

</head>

<body>

<h2>📷 ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ Gallery</h2>

<div id="gallery"></div>

<div id="preview">
<img id="previewImg">
</div>
<script type="module">
  import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const gallery = document.getElementById("gallery");

async function loadGallery() {

  gallery.innerHTML = "";

  const snapshot = await getDocs(collection(db, "Gallery"));

  snapshot.forEach((doc) => {

    const data = doc.data();

    if (data.youtubeUrl && data.youtubeUrl.trim() !== "") {

      gallery.innerHTML += `
      <div class="card">
        <a href="${data.youtubeUrl}" target="_blank">
  <img src="https://img.youtube.com/vi/${
    data.youtubeUrl.includes("youtu.be/")
      ? data.youtubeUrl.split("youtu.be/")[1].split("?")[0]
      : data.youtubeUrl.split("v=")[1].split("&")[0]
  }/hqdefault.jpg" alt="Video Thumbnail">
</a>
          




          
        

        <h3>${data.title || "ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ"}</h3>
      </div>
      `;

    } else {

      gallery.innerHTML += `
      <div class="card">

        <img
          src="${data.photoUrl}"
          alt="${data.title || ""}"
          onclick="showImage('${data.photoUrl}')"
          onerror="this.src='logo.png'">

        <h3>${data.title || "ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ"}</h3>

      </div>
      `;
    }

  });

}
  window.showImage = function(url) {
    history.pushState({preview:true}, "");

    document.getElementById("preview").style.display = "flex";
    document.getElementById("previewImg").src = url;
}

document.getElementById("preview").onclick = function() {
    this.style.display = "none";
    history.back();
}

window.addEventListener("popstate", () => {
    document.getElementById("preview").style.display = "none";
});

loadGallery().catch(error => {
    console.error(error);
    alert("Gallery Load Error: " + error.message);
});
</script>

</body>
</html>
