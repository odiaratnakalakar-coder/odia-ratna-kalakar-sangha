<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Update Members</title>
</head>
<body>

<h2>Updating Members...</h2>

<script type="module">
import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const snap = await getDocs(collection(db, "members"));

let updated = 0;

for (const d of snap.docs) {

  const data = d.data();

  // ଯେଉଁ Member ଙ୍କର status ନାହିଁ ସେମାନଙ୍କୁ ମାତ୍ର update କରିବ
  if (!data.status) {

    await updateDoc(doc(db, "members", d.id), {
      status: "approved"
    });

    updated++;
  }
}

alert("✅ " + updated + " Members Updated Successfully");
</script>

</body>
</html>
