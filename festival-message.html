<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Festival Message | ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Oriya",sans-serif;
    background:#f3f6fa;
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#0f172a,#1d4ed8);
    color:white;
    text-align:center;
    padding:22px 15px;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:7px 0 0;
    font-size:14px;
}

.container{
    max-width:750px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 15px;
    color:#1d4ed8;
    font-size:19px;
}

label{
    display:block;
    margin:13px 0 7px;
    font-weight:bold;
}

select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

textarea{
    min-height:210px;
    resize:vertical;
    line-height:1.6;
}

select:focus,
textarea:focus{
    border-color:#2563eb;
}

button{
    cursor:pointer;
}

.save-btn{
    width:100%;
    margin-top:13px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.status{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
    text-align:center;
    font-weight:bold;
}

.preview{
    margin-top:18px;
    padding:16px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:13px;
}

.preview-title{
    font-weight:bold;
    color:#166534;
    margin-bottom:10px;
}

#preview{
    white-space:pre-wrap;
    line-height:1.7;
}

.member-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    margin-bottom:15px;
    background:#f8fafc;
    border-radius:12px;
    border:1px solid #e2e8f0;
}

.select-all-label{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    font-weight:bold;
}

.select-all-label input{
    width:20px;
    height:20px;
    accent-color:#2563eb;
}

.selected-count{
    background:#e0e7ff;
    color:#3730a3;
    padding:7px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.selected-whatsapp{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-bottom:15px;
}

.selected-whatsapp:hover{
    background:#1ebe5d;
}

.member{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 0;
    border-bottom:1px solid #e5e7eb;
}

.member:last-child{
    border-bottom:0;
}

.member-check{
    width:20px;
    height:20px;
    flex-shrink:0;
    accent-color:#2563eb;
}

.member-info{
    flex:1;
    min-width:0;
}

.member-name{
    font-size:17px;
    font-weight:bold;
}

.member-mobile{
    margin-top:4px;
    color:#64748b;
    font-size:14px;
}

.whatsapp-btn{
    border:0;
    background:#25D366;
    color:white;
    padding:10px 13px;
    border-radius:9px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:20px;
    color:#64748b;
}

.empty{
    text-align:center;
    padding:20px;
    color:#64748b;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:10px;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:13px;
    padding:10px 15px 30px;
}

@media(max-width:520px){

    .header h1{
        font-size:20px;
    }

    .member-name{
        font-size:16px;
    }

    .whatsapp-btn{
        padding:9px 10px;
        font-size:13px;
    }

}

</style>

</head>

<body>


<div class="header">

    <h1>🎉 Festival Message</h1>

    <p>
        ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ
    </p>

</div>


<div class="container">


<!-- FESTIVAL -->

<div class="card">

    <h2>🇮🇳 Festival Message</h2>

    <label for="festival">
        Festival ବାଛନ୍ତୁ
    </label>

    <select id="festival" onchange="changeFestival()">

        <option value="independence">
            🇮🇳 ସ୍ୱାଧୀନତା ଦିବସ
        </option>

        <option value="ganesh">
            🐘 ଗଣେଶ ପୂଜା
        </option>

        <option value="rathayatra">
            🛕 ରଥଯାତ୍ରା
        </option>

        <option value="nuakhai">
            🌾 ନୂଆଖାଇ
        </option>

        <option value="diwali">
            🪔 ଦୀପାବଳି
        </option>

        <option value="newyear">
            🎉 ନୂଆ ବର୍ଷ
        </option>

    </select>


    <label for="message">
        📝 ବାର୍ତ୍ତା
    </label>

    <textarea
        id="message"
        oninput="updatePreview()"></textarea>


    <button
        class="save-btn"
        onclick="saveMessage()">

        💾 Message Save

    </button>


    <div
        id="status"
        class="status">

        ✅ Message Firestore ରେ Save ହୋଇଛି

    </div>


    <div class="preview">

        <div class="preview-title">
            👀 Message Preview
        </div>

        <div id="preview"></div>

    </div>

</div>



<!-- MEMBERS -->

<div class="card">

    <h2>
        👥 ସଦସ୍ୟ ତାଲିକା
    </h2>


    <div class="member-tools">

        <label class="select-all-label">

            <input
                type="checkbox"
                id="selectAll"
                onchange="selectAllMembers()">

            ☑️ ସମସ୍ତଙ୍କୁ ବାଛନ୍ତୁ

        </label>


        <div
            id="selectedCount"
            class="selected-count">

            0 Selected

        </div>

    </div>


    <button
        class="selected-whatsapp"
        onclick="sendSelectedWhatsApp()">

        🟢 Selected Member WhatsApp

    </button>


    <div id="memberList">

        <div class="loading">
            ⏳ Member List Loading...
        </div>

    </div>

</div>


</div>


<div class="footer">

    © 2026 ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ

</div>



<!-- =====================================
     FESTIVAL SYSTEM
===================================== -->

<script>

const messages = {

    independence:
`🇮🇳 ସ୍ୱାଧୀନତା ଦିବସର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🇮🇳

ଆମ ତ୍ରିରଙ୍ଗା ଆମର ଗର୍ବ।
ଆମ ସ୍ୱାଧୀନତା ଆମର ଅମୂଲ୍ୟ ଅଧିକାର।

ଦେଶର ଏକତା, ଭାଇଚାରା ଓ ଗୌରବ ପାଇଁ ଆସନ୍ତୁ ଆମେ ସମସ୍ତେ ଏକାଠି ହୋଇ ଆଗକୁ ବଢ଼ିବା।

🇮🇳 ଜୟ ହିନ୍ଦ!
🇮🇳 ବନ୍ଦେ ମାତରମ୍!

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,


    ganesh:
`🐘 ଶ୍ରୀ ଗଣେଶ ପୂଜାର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🐘

ବିଘ୍ନବିନାଶକ ପ୍ରଭୁ ଶ୍ରୀ ଗଣେଶଙ୍କ ଆଶୀର୍ବାଦରେ ସମସ୍ତଙ୍କ ଜୀବନ ସୁଖ, ଶାନ୍ତି ଓ ସମୃଦ୍ଧିରେ ପରିପୂର୍ଣ୍ଣ ହେଉ।

ଗଣପତି ବାପ୍ପା ମୋରିଆ! 🙏

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,


    rathayatra:
`🛕 ପବିତ୍ର ରଥଯାତ୍ରାର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🛕

ମହାପ୍ରଭୁ ଶ୍ରୀଜଗନ୍ନାଥଙ୍କ କୃପାରୁ ସମସ୍ତଙ୍କ ଜୀବନ ସୁଖ, ଶାନ୍ତି ଓ ସମୃଦ୍ଧିରେ ପରିପୂର୍ଣ୍ଣ ହେଉ।

ଜୟ ଜଗନ୍ନାଥ! 🙏

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,


    nuakhai:
`🌾 ନୂଆଖାଇ ଜୁହାର 🌾

ନୂଆଖାଇ ପର୍ବ ଅବସରରେ ସମସ୍ତ ସଦସ୍ୟ ଓ ପରିବାରବର୍ଗଙ୍କୁ ଅନେକ ଅନେକ ଶୁଭେଚ୍ଛା।

ମା' ସମଲେଇଙ୍କ ଆଶୀର୍ବାଦରେ ସମସ୍ତଙ୍କ ଜୀବନ ସୁଖମୟ ହେଉ।

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,


    diwali:
`🪔 ଦୀପାବଳିର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🪔

ଆଲୋକର ପର୍ବ ଦୀପାବଳି ସମସ୍ତଙ୍କ ଜୀବନରେ ସୁଖ, ଶାନ୍ତି ଓ ସମୃଦ୍ଧି ଆଣିଦେଉ।

ଶୁଭ ଦୀପାବଳି! 🪔✨

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,


    newyear:
`🎉 ନବବର୍ଷର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🎉

ନୂଆ ବର୍ଷ ସମସ୍ତଙ୍କ ଜୀବନରେ ନୂଆ ଆଶା, ନୂଆ ସଫଳତା ଓ ଅନେକ ଖୁସି ଆଣିଦେଉ।

ଶୁଭ ନବବର୍ଷ! 🙏

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`

};


function changeFestival(){

    const festival =
        document.getElementById("festival").value;

    const message =
        messages[festival] || "";

    document.getElementById("message").value =
        message;

    updatePreview();

}


function updatePreview(){

    document.getElementById("preview").textContent =
        document.getElementById("message").value;

}


function loadFestivalFromURL(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const festival =
        params.get("festival");

    if(
        festival &&
        messages[festival]
    ){

        document.getElementById("festival").value =
            festival;

    }

    changeFestival();

}


loadFestivalFromURL();

</script>



<!-- =====================================
     FIREBASE / MEMBERS SYSTEM
===================================== -->

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* SAVE MESSAGE */

window.saveMessage = async function(){

    const festival =
        document.getElementById("festival").value;

    const message =
        document.getElementById("message").value.trim();


    if(!message){

        alert("ଦୟାକରି Message ଲେଖନ୍ତୁ।");

        return;

    }


    try{

        await addDoc(
            collection(
                db,
                "FestivalMessages"
            ),
            {
                festival:festival,
                message:message,
                createdAt:serverTimestamp()
            }
        );


        const status =
            document.getElementById("status");

        status.style.display =
            "block";


        setTimeout(
            function(){

                status.style.display =
                    "none";

            },
            3000
        );


    }catch(error){

        console.error(error);

        alert(
            "Message Save ହେଲା ନାହିଁ:\n" +
            error.message
        );

    }

};



/* LOAD MEMBERS */

async function loadMembers(){

    const memberList =
        document.getElementById("memberList");


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "members"
                )
            );


        memberList.innerHTML = "";


        if(snapshot.empty){

            memberList.innerHTML =
                `<div class="empty">
                    😕 କୌଣସି Member ମିଳିଲା ନାହିଁ।
                </div>`;

            return;

        }


        snapshot.forEach(function(doc){

            const data =
                doc.data();


            const name =
                data.name ||
                data.fullName ||
                data.memberName ||
                "ନାମ ନାହିଁ";


            const mobile =
                data.mobile ||
                data.phone ||
                data.phoneNumber ||
                "";


            if(!mobile){

                return;

            }


            let number =
                String(mobile)
                .replace(/\D/g,"");


            if(number.length === 10){

                number =
                    "91" + number;

            }


            const member =
                document.createElement("div");

            member.className =
                "member";


            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.className =
                "member-check";

            checkbox.dataset.number =
                number;

            checkbox.dataset.name =
                name;

            checkbox.addEventListener(
                "change",
                updateSelectedCount
            );


            const info =
                document.createElement("div");

            info.className =
                "member-info";


            const nameDiv =
                document.createElement("div");

            nameDiv.className =
                "member-name";

            nameDiv.textContent =
                name;


            const mobileDiv =
                document.createElement("div");

            mobileDiv.className =
                "member-mobile";

            mobileDiv.textContent =
                "📱 " + mobile;


            info.appendChild(nameDiv);

            info.appendChild(mobileDiv);


            const button =
                document.createElement("button");

            button.className =
                "whatsapp-btn";

            button.textContent =
                "🟢 WhatsApp";


            button.onclick =
                function(){

                    sendWhatsApp(
                        number,
                        name
                    );

                };


            member.appendChild(checkbox);

            member.appendChild(info);

            member.appendChild(button);

            memberList.appendChild(member);

        });


        updateSelectedCount();


    }catch(error){

        console.error(error);

        memberList.innerHTML =
            `<div class="error">
                ❌ Member List Load ହେଲା ନାହିଁ।<br><br>
                Firebase error: ${error.message}
            </div>`;

    }

}



/* SELECT ALL */

window.selectAllMembers = function(){

    const checked =
        document.getElementById(
            "selectAll"
        ).checked;


    document
        .querySelectorAll(".member-check")
        .forEach(function(box){

            box.checked =
                checked;

        });


    updateSelectedCount();

};



/* COUNT */

function updateSelectedCount(){

    const count =
        document.querySelectorAll(
            ".member-check:checked"
        ).length;


    document.getElementById(
        "selectedCount"
    ).textContent =
        count + " Selected";

}



/* SINGLE WHATSAPP */

function sendWhatsApp(
    number,
    name
){

    const message =
        document.getElementById(
            "message"
        ).value.trim();


    if(!message){

        alert(
            "ପ୍ରଥମେ Festival Message ବାଛନ୍ତୁ।"
        );

        return;

    }


    const finalMessage =
        "ନମସ୍କାର " +
        name +
        " 🙏\n\n" +
        message;


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(
            finalMessage
        );


    window.open(
        url,
        "_blank"
    );

}



/* SELECTED WHATSAPP */

window.sendSelectedWhatsApp = function(){

    const selected =
        Array.from(
            document.querySelectorAll(
                ".member-check:checked"
            )
        );


    if(!selected.length){

        alert(
            "ଦୟାକରି କମ୍ ସେ କମ୍ ଜଣେ Member ବାଛନ୍ତୁ।"
        );

        return;

    }


    const first =
        selected[0];


    sendWhatsApp(
        first.dataset.number,
        first.dataset.name
    );

};



/* START MEMBER LOAD */

loadMembers();

</script>


</body>

</html>
