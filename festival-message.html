<!DOCTYPE html>
<html lang="or">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Festival Message | ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Oriya",sans-serif;
    background:#f3f6fa;
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#0f172a,#1d4ed8);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:7px 0 0;
    font-size:14px;
}

.container{
    max-width:750px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 15px;
    color:#1d4ed8;
    font-size:19px;
}

label{
    display:block;
    margin:13px 0 7px;
    font-weight:bold;
}

select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

textarea{
    min-height:210px;
    resize:vertical;
    line-height:1.6;
}

select:focus,
textarea:focus{
    border-color:#2563eb;
}

button{
    cursor:pointer;
}

.save-btn{
    width:100%;
    margin-top:13px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.save-btn:hover{
    background:#1d4ed8;
}

.status{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
    text-align:center;
    font-weight:bold;
}

.preview{
    margin-top:18px;
    padding:16px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:13px;
}

.preview-title{
    font-weight:bold;
    color:#166534;
    margin-bottom:10px;
}

#preview{
    white-space:pre-wrap;
    line-height:1.7;
}

.member{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #e5e7eb;
}

.member:last-child{
    border-bottom:0;
}

.member-info{
    flex:1;
}

.member-name{
    font-size:17px;
    font-weight:bold;
}

.member-mobile{
    margin-top:4px;
    color:#64748b;
    font-size:14px;
}

.whatsapp-btn{
    border:0;
    background:#25D366;
    color:white;
    padding:10px 13px;
    border-radius:9px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
}

.whatsapp-btn:hover{
    background:#1ebe5d;
}

.loading{
    text-align:center;
    padding:20px;
    color:#64748b;
}

.empty{
    text-align:center;
    padding:20px;
    color:#64748b;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:10px;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:13px;
    padding:10px 15px 30px;
}

@media(max-width:520px){

    .header h1{
        font-size:20px;
    }

    .member{
        align-items:center;
    }

    .member-name{
        font-size:16px;
    }

    .whatsapp-btn{
        padding:9px 10px;
        font-size:13px;
    }
}
</style>

</head>

<body>

<div class="header">

    <h1>🎉 Festival Message</h1>

    <p>
        ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ
    </p>

</div>


<div class="container">

    <!-- FESTIVAL MESSAGE -->

    <div class="card">

        <h2>🇮🇳 Festival Message</h2>

        <label for="festival">
            Festival ବାଛନ୍ତୁ
        </label>

        <select id="festival" onchange="changeFestival()">

            <option value="independence">
                🇮🇳 ସ୍ୱାଧୀନତା ଦିବସ
            </option>

            <option value="rathayatra">
                🛕 ରଥଯାତ୍ରା
            </option>

            <option value="nuakhai">
                🌾 ନୂଆଖାଇ
            </option>

            <option value="diwali">
                🪔 ଦୀପାବଳି
            </option>

            <option value="newyear">
                🎉 ନୂଆ ବର୍ଷ
            </option>

        </select>


        <label for="message">
            📝 ବାର୍ତ୍ତା
        </label>

        <textarea
            id="message"
            placeholder="Festival message ଏଠାରେ ଲେଖନ୍ତୁ..."
            oninput="updatePreview()"></textarea>


        <button
            class="save-btn"
            onclick="saveMessage()">

            💾 Message Save

        </button>


        <div
            id="status"
            class="status">

            ✅ Message Firestore ରେ Save ହୋଇଛି

        </div>


        <div class="preview">

            <div class="preview-title">
                👀 Message Preview
            </div>

            <div id="preview"></div>

        </div>

    </div>


    <!-- MEMBER LIST -->

    <div class="card">

        <h2>
            👥 ସଦସ୍ୟ ତାଲିକା
        </h2>

        <div id="memberList">

            <div class="loading">
                ⏳ Member List Loading...
            </div>

        </div>

    </div>

</div>


<div class="footer">

    © 2026 ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ

</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const messages = {

    independence:
`🇮🇳 ସ୍ୱାଧୀନତା ଦିବସର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🇮🇳

ଆମ ତ୍ରିରଙ୍ଗା ଆମର ଗର୍ବ।
ଆମ ସ୍ୱାଧୀନତା ଆମର ଅମୂଲ୍ୟ ଅଧିକାର।

ଦେଶର ଏକତା, ଭାଇଚାରା ଓ ଗୌରବ ପାଇଁ ଆସନ୍ତୁ ଆମେ ସମସ୍ତେ ଏକାଠି ହୋଇ ଆଗକୁ ବଢ଼ିବା।

🇮🇳 ଜୟ ହିନ୍ଦ!
🇮🇳 ବନ୍ଦେ ମାତରମ୍!

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,

    rathayatra:
`🛕 ପବିତ୍ର ରଥଯାତ୍ରାର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🛕

ମହାପ୍ରଭୁ ଶ୍ରୀଜଗନ୍ନାଥଙ୍କ କୃପାରୁ ସମସ୍ତଙ୍କ ଜୀବନ ସୁଖ, ଶାନ୍ତି ଓ ସମୃଦ୍ଧିରେ ପରିପୂର୍ଣ୍ଣ ହେଉ।

ଜୟ ଜଗନ୍ନାଥ! 🙏

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,

    nuakhai:
`🌾 ନୂଆଖାଇ ଜୁହାର 🌾

ନୂଆଖାଇ ପର୍ବ ଅବସରରେ ସମସ୍ତ ସଦସ୍ୟ ଓ ପରିବାରବର୍ଗଙ୍କୁ ଅନେକ ଅନେକ ଶୁଭେଚ୍ଛା।

ମା' ସମଲେଇଙ୍କ ଆଶୀର୍ବାଦରେ ସମସ୍ତଙ୍କ ଜୀବନ ସୁଖମୟ ହେଉ।

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,

    diwali:
`🪔 ଦୀପାବଳିର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🪔

ଆଲୋକର ପର୍ବ ଦୀପାବଳି ସମସ୍ତଙ୍କ ଜୀବନରେ ସୁଖ, ଶାନ୍ତି ଓ ସମୃଦ୍ଧି ଆଣିଦେଉ।

ଶୁଭ ଦୀପାବଳି! 🪔✨

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`,

    newyear:
`🎉 ନବବର୍ଷର ହାର୍ଦ୍ଦିକ ଶୁଭେଚ୍ଛା 🎉

ନୂଆ ବର୍ଷ ସମସ୍ତଙ୍କ ଜୀବନରେ ନୂଆ ଆଶା, ନୂଆ ସଫଳତା ଓ ଅନେକ ଖୁସି ଆଣିଦେଉ।

ଶୁଭ ନବବର୍ଷ! 🙏

ଓଡ଼ିଆ ରତ୍ନ କଳାକାର ସଂଘ, ସୁରତ`

};


// Festival change

window.changeFestival = function(){

    const festival =
        document.getElementById("festival").value;

    document.getElementById("message").value =
        messages[festival] || "";

    updatePreview();
};


// Preview

window.updatePreview = function(){

    const message =
        document.getElementById("message").value;

    document.getElementById("preview").textContent =
        message;

};


// Save to Firestore

window.saveMessage = async function(){

    const festival =
        document.getElementById("festival").value;

    const message =
        document.getElementById("message").value.trim();


    if(!message){

        alert("ଦୟାକରି Message ଲେଖନ୍ତୁ।");

        return;
    }


    try{

        await addDoc(
            collection(db,"FestivalMessages"),
            {
                festival: festival,
                message: message,
                createdAt: serverTimestamp()
            }
        );


        const status =
            document.getElementById("status");

        status.style.display = "block";


        setTimeout(() => {

            status.style.display = "none";

        },3000);


    }catch(error){

        console.error(error);

        alert(
            "Message Save ହେଲା ନାହିଁ:\n" +
            error.message
        );

    }

};


// Load Members

async function loadMembers(){

    const memberList =
        document.getElementById("memberList");


    try{

        const snapshot =
            await getDocs(
                collection(db,"members")
            );


        if(snapshot.empty){

            memberList.innerHTML =
                `<div class="empty">
                    😕 କୌଣସି Member ମିଳିଲା ନାହିଁ।
                </div>`;

            return;
        }


        memberList.innerHTML = "";


        snapshot.forEach((doc) => {

            const data = doc.data();


            const name =
                data.name ||
                data.fullName ||
                data.memberName ||
                "ନାମ ନାହିଁ";


            const mobile =
                data.mobile ||
                data.phone ||
                data.phoneNumber ||
                "";


            if(!mobile){

                return;
            }


            const cleanNumber =
                String(mobile)
                    .replace(/\D/g,"");


            const member =
                document.createElement("div");

            member.className = "member";


            const info =
                document.createElement("div");

            info.className = "member-info";


            const nameDiv =
                document.createElement("div");

            nameDiv.className =
                "member-name";

            nameDiv.textContent =
                name;


            const mobileDiv =
                document.createElement("div");

            mobileDiv.className =
                "member-mobile";

            mobileDiv.textContent =
                "📱 " + mobile;


            info.appendChild(nameDiv);

            info.appendChild(mobileDiv);


            const button =
                document.createElement("button");

            button.className =
                "whatsapp-btn";

            button.textContent =
                "🟢 WhatsApp";


            button.onclick = function(){

                sendWhatsApp(
                    cleanNumber,
                    name
                );

            };


            member.appendChild(info);

            member.appendChild(button);


            memberList.appendChild(member);

        });


        if(!memberList.innerHTML.trim()){

            memberList.innerHTML =
                `<div class="empty">
                    📱 Mobile number ଥିବା Member ମିଳିଲା ନାହିଁ।
                </div>`;

        }


    }catch(error){

        console.error(error);

        memberList.innerHTML =
            `<div class="error">
                ❌ Member List Load ହେଲା ନାହିଁ.<br><br>
                ${error.message}
            </div>`;

    }

}


// WhatsApp

function sendWhatsApp(number,name){

    const message =
        document.getElementById("message").value.trim();


    if(!message){

        alert("ପ୍ରଥମେ Festival Message ଲେଖନ୍ତୁ।");

        return;
    }


    let finalMessage =
        "ନମସ୍କାର " + name + " 🙏\n\n" +
        message;


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(finalMessage);


    window.open(
        url,
        "_blank"
    );

}


// Start

document.addEventListener(
    "DOMContentLoaded",
    function(){

        changeFestival();

        loadMembers();

    }
);

</script>

</body>
</html>
