/* ==========================================
   CHANGE FESTIVAL
========================================== */

window.changeFestival = function(){

    const festival =
        document.getElementById(
            "festival"
        ).value;


    document.getElementById(
        "message"
    ).value =
        messages[festival] || "";


    updatePreview();

};



/* ==========================================
   PREVIEW
========================================== */

window.updatePreview = function(){

    document.getElementById(
        "preview"
    ).textContent =
        document.getElementById(
            "message"
        ).value;

};



/* ==========================================
   READ FESTIVAL FROM CALENDAR
========================================== */

function loadFestivalFromURL(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const festival =
        params.get("festival");


    if(
        festival &&
        messages[festival]
    ){

        document.getElementById(
            "festival"
        ).value =
            festival;

    }


    changeFestival();

}



/* ==========================================
   FIREBASE
========================================== */

let db = null;

let firebaseReady = false;


async function startFirebase(){

    try{

        const firebase =
            await import(
                "./firebase.js"
            );


        db =
            firebase.db;


        firebaseReady =
            true;


        loadMembers();


    }catch(error){

        console.error(
            "Firebase Error:",
            error
        );


        document.getElementById(
            "memberList"
        ).innerHTML = `

            <div class="error">

                ❌ Firebase connection ହୋଇନାହିଁ।

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



/* ==========================================
   SAVE MESSAGE
========================================== */

window.saveMessage = async function(){

    if(!firebaseReady || !db){

        alert(
            "Firebase connect ହୋଇନାହିଁ।"
        );

        return;

    }


    const festival =
        document.getElementById(
            "festival"
        ).value;


    const message =
        document.getElementById(
            "message"
        ).value.trim();


    if(!message){

        alert(
            "ଦୟାକରି Message ଲେଖନ୍ତୁ।"
        );

        return;

    }


    try{

        const firestore =
            await import(
                "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
            );


        await firestore.addDoc(
            firestore.collection(
                db,
                "FestivalMessages"
            ),
            {
                festival:festival,
                message:message,
                createdAt:
                    firestore.serverTimestamp()
            }
        );


        const status =
            document.getElementById(
                "status"
            );


        status.style.display =
            "block";


        setTimeout(
            function(){

                status.style.display =
                    "none";

            },
            3000
        );


    }catch(error){

        console.error(error);


        alert(
            "Message Save ହେଲା ନାହିଁ:\n" +
            error.message
        );

    }

};

async function loadMembers(){

    if(!db){

        return;

    }


    const memberList =
        document.getElementById(
            "memberList"
        );


    try{

        const firestore =
            await import(
                "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
            );


        const snapshot =
            await firestore.getDocs(
                firestore.collection(
                    db,
                    "members"
                )
            );


        memberList.innerHTML = "";


        if(snapshot.empty){

            memberList.innerHTML = `

                <div class="empty">

                    😕 କୌଣସି Member ମିଳିଲା ନାହିଁ।

                </div>

            `;

            return;

        }


        snapshot.forEach(
            function(doc){

                const data =
                    doc.data();


                const name =
                    data.name ||
                    data.fullName ||
                    data.memberName ||
                    "ନାମ ନାହିଁ";


                const mobile =
                    data.mobile ||
                    data.phone ||
                    data.phoneNumber ||
                    "";


                if(!mobile){

                    return;

                }


                let number =
                    String(mobile)
                    .replace(/\D/g,"");


                if(
                    number.length === 10
                ){

                    number =
                        "91" + number;

                }


                const member =
                    document.createElement(
                        "div"
                    );


                member.className =
                    "member";


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.className =
                    "member-check";


                checkbox.dataset.number =
                    number;


                checkbox.dataset.name =
                    name;


                checkbox.addEventListener(
                    "change",
                    updateSelectedCount
                );


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "member-info";


                const nameDiv =
                    document.createElement(
                        "div"
                    );


                nameDiv.className =
                    "member-name";


                nameDiv.textContent =
                    name;


                const mobileDiv =
                    document.createElement(
                        "div"
                    );


                mobileDiv.className =
                    "member-mobile";


                mobileDiv.textContent =
                    "📱 " + mobile;


                info.appendChild(
                    nameDiv
                );


                info.appendChild(
                    mobileDiv
                );


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "whatsapp-btn";


                button.textContent =
                    "🟢 WhatsApp";


                button.onclick =
                    function(){

                        sendWhatsApp(
                            number,
                            name
                        );

                    };


                member.appendChild(
                    checkbox
                );


                member.appendChild(
                    info
                );


                member.appendChild(
                    button
                );


                memberList.appendChild(
                    member
                );

            }
        );


        updateSelectedCount();


    }catch(error){

        console.error(error);


        memberList.innerHTML = `

            <div class="error">

                ❌ Member List Load ହେଲା ନାହିଁ।

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



/* ==========================================
   SELECT ALL
========================================== */

window.selectAllMembers = function(){

    const checked =
        document.getElementById(
            "selectAll"
        ).checked;


    document
        .querySelectorAll(
            ".member-check"
        )
        .forEach(
            function(box){

                box.checked =
                    checked;

            }
        );


    updateSelectedCount();

};



/* ==========================================
   SELECTED COUNT
========================================== */

function updateSelectedCount(){

    const count =
        document.querySelectorAll(
            ".member-check:checked"
        ).length;


    document.getElementById(
        "selectedCount"
    ).textContent =
        count + " Selected";

}



/* ==========================================
   SINGLE WHATSAPP
========================================== */

function sendWhatsApp(
    number,
    name
){

    const message =
        document.getElementById(
            "message"
        ).value.trim();


    if(!message){

        alert(
            "ପ୍ରଥମେ Festival Message ବାଛନ୍ତୁ।"
        );

        return;

    }


    const finalMessage =
        "ନମସ୍କାର " +
        name +
        " 🙏\n\n" +
        message;


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(
            finalMessage
        );


    window.open(
        url,
        "_blank"
    );

}



/* ==========================================
   SELECTED WHATSAPP
========================================== */

window.sendSelectedWhatsApp = function(){

    const selected =
        Array.from(
            document.querySelectorAll(
                ".member-check:checked"
            )
        );


    if(!selected.length){

        alert(
            "ଦୟାକରି କମ୍ ସେ କମ୍ ଜଣେ Member ବାଛନ୍ତୁ।"
        );

        return;

    }


    /*
    WhatsApp does not allow a normal
    website to automatically send one
    message to many numbers silently.

    So open the first selected member.
    */

    const first =
        selected[0];


    sendWhatsApp(
        first.dataset.number,
        first.dataset.name
    );

};
