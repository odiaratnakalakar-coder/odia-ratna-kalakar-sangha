async function loadMembers(){

    const snap = await getDocs(collection(db,"members"));

    members = [];

    snap.forEach(doc=>{
        members.push({
            id:doc.id,
            ...doc.data()
        });
    });

    members.sort((a,b)=>
        (a.name || "").localeCompare(b.name || "")
    );

    renderMembers(members);

}
