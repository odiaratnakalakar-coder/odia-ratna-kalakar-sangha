<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ସମସ୍ତ ସଦସ୍ୟ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#0d6efd;
    color:#fff;
    text-align:center;
    padding:18px;
    font-size:22px;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:1000px;
    margin:20px auto;
}

.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

#memberList{
    display:flex;
    flex-direction:column;
    gap:12px;
}
</style>
</head>

<body>

<header>
👥 ସମସ୍ତ ସଦସ୍ୟ
</header>

<div class="container">

<div class="search-box">


<div class="search-box">
<input type="text" id="search" placeholder="ନାମ କିମ୍ବା ମୋବାଇଲ ନମ୍ବରରେ Search କରନ୍ତୁ">
</div>

<div id="memberList">

</div>





</div>

</div>
<!-- View Member Modal -->
<div id="viewModal" style="display:none;" class="modal">

<div class="modal-box">

<span id="closeModal" style="float:right;font-size:28px;cursor:pointer;">&times;</span>

<img id="viewPhoto"
style="width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid #0d6efd;display:block;margin:auto;">

<h2 id="viewName" style="text-align:center;margin-top:15px;"></h2>

<p><b>Member ID:</b> <span id="viewMemberId"></span></p>
<p><b>Father:</b> <span id="viewFather"></span></p>
<p><b>Mobile:</b> <span id="viewMobile"></span></p>
<p><b>Address:</b> <span id="viewAddress"></span></p>

<a id="callBtn"
style="display:block;background:#198754;color:#fff;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:15px;">
📞 Call Member
</a>

</div>

</div>

<style>

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:flex;
justify-content:center;
align-items:center;
padding:15px;
}

.modal-box{
background:#fff;
width:100%;
max-width:420px;
border-radius:12px;
padding:20px;
color:#000;
}

</style>

</script>

</body>
</html>
