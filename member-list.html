<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ସଦସ୍ୟ ତାଲିକା</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#00695c;
color:white;
padding:16px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

#memberList{
padding:15px;
}

.member-card{
background:#fff;
border-radius:10px;
padding:12px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.member-info{
display:flex;
align-items:center;
gap:12px;
}

.member-info img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:2px solid #00695c;
}

.member-name{
font-size:18px;
font-weight:bold;
}

.member-id{
font-size:14px;
color:#666;
}

.view-btn{
background:#00695c;
color:white;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;
}
  .modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:999;
overflow:auto;
}

.modal-content{
background:#fff;
width:90%;
max-width:420px;
margin:40px auto;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.modal-content img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #00695c;
margin-bottom:15px;
}

.modal-content p{
margin:10px 0;
text-align:left;
}

#closeModal{
position:absolute;
right:15px;
top:10px;
font-size:28px;
cursor:pointer;
font-weight:bold;
}

.action-btn{
display:block;
background:#00695c;
color:#fff;
padding:12px;
margin-top:12px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}
</style>

</head>

<body>

<header>
👥 ସଦସ୍ୟ ତାଲିକା
</header>

<div class="search-box">
<input
type="text"
id="search"
placeholder="ନାମ କିମ୍ବା ମୋବାଇଲ୍ ନମ୍ବରରେ Search କରନ୍ତୁ">
</div>

<div id="memberList"></div>
<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const memberList = document.getElementById("memberList");
const searchInput = document.getElementById("search");

let members = [];
function renderMembers(list) {

    memberList.innerHTML = "";

    list.forEach(member => {

        const photo = member.photoUrl || "https://via.placeholder.com/60";

        memberList.innerHTML += `
        <div class="member-card">

            <div class="member-info">

                <img src="${photo}" alt="Photo">

                <div>
                    <div class="member-name">${member.name || ""}</div>
                    <div class="member-id">${member.memberId || ""}</div>
                </div>

            </div>

            <button class="view-btn" onclick="viewMember('${member.id}')">
                View
            </button>

        </div>
        `;
    });

}
async function loadMembers() {

    const snap = await getDocs(collection(db, "members"));

    members = [];

    snap.forEach(doc => {
        members.push({
            id: doc.id,
            ...doc.data()
        });
    });

    members.sort((a, b) =>
        (a.name || "").localeCompare(b.name || "")
    );

    renderMembers(members);

        
        
       
      
        
         
    


}
window.viewMember = function(id){

    const member = members.find(m => m.id === id);
    if(!member) return;

    document.getElementById("memberModal").style.display = "block";

    document.getElementById("modalPhoto").src =
        member.photoUrl || "https://via.placeholder.com/120";

    document.getElementById("modalName").textContent = member.name || "";
    document.getElementById("modalId").textContent = member.memberId || "";
    document.getElementById("modalFather").textContent = member.father || "";
    document.getElementById("modalMobile").textContent = member.mobile || "";
    document.getElementById("modalAddress").textContent = member.address || "";
    document.getElementById("modalTxn").textContent = member.txnId || "";
    document.getElementById("modalPaid").textContent =
        member.paid ? "Yes" : "No";

    document.getElementById("callBtn").href =
        "tel:" + (member.mobile || "");

    document.getElementById("whatsappBtn").href =
        "https://wa.me/91" + (member.mobile || "");
};

document.getElementById("closeModal").onclick = function(){
    document.getElementById("memberModal").style.display = "none";
};

window.onclick = function(e){
    if(e.target == document.getElementById("memberModal")){
        document.getElementById("memberModal").style.display = "none";
    }
};

    

    
         
    


loadMembers();
searchInput.addEventListener("input", () => {

    const text = searchInput.value.toLowerCase();

    const filtered = members.filter(member =>

        (member.name || "").toLowerCase().includes(text) ||

        (member.mobile || "").includes(text) ||

        (member.memberId || "").toLowerCase().includes(text)

    );

    renderMembers(filtered);

});
</script>
  <div id="memberModal" class="modal">

  <div class="modal-content">

    <span id="closeModal">&times;</span>

    <img id="modalPhoto" src="" alt="Photo">

    <h2 id="modalName"></h2>

    <p><b>Member ID:</b> <span id="modalId"></span></p>
    <p><b>Father:</b> <span id="modalFather"></span></p>
    <p><b>Mobile:</b> <span id="modalMobile"></span></p>
    <p><b>Address:</b> <span id="modalAddress"></span></p>
    <p><b>Txn ID:</b> <span id="modalTxn"></span></p>
    <p><b>Paid:</b> <span id="modalPaid"></span></p>

    <a id="callBtn" class="action-btn">📞 Call</a>

    <a id="whatsappBtn" class="action-btn">💬 WhatsApp</a>

  </div>

  </div>
</body>
</html>
