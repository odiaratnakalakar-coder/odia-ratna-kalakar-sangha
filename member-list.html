<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ସଦସ୍ୟ ତାଲିକା</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#00695c;
color:white;
padding:16px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

#memberList{
padding:15px;
}

.member-card{
background:#fff;
border-radius:10px;
padding:12px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.member-info{
display:flex;
align-items:center;
gap:12px;
}

.member-info img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:2px solid #00695c;
}

.member-name{
font-size:18px;
font-weight:bold;
}

.member-id{
font-size:14px;
color:#666;
}

.view-btn{
background:#00695c;
color:white;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;
}
</style>

</head>

<body>

<header>
👥 ସଦସ୍ୟ ତାଲିକା
</header>

<div class="search-box">
<input
type="text"
id="search"
placeholder="ନାମ କିମ୍ବା ମୋବାଇଲ୍ ନମ୍ବରରେ Search କରନ୍ତୁ">
</div>

<div id="memberList"></div>
<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const memberList = document.getElementById("memberList");
const searchInput = document.getElementById("search");

let members = [];
function renderMembers(list) {

    memberList.innerHTML = "";

    list.forEach(member => {

        const photo = member.photoUrl || "https://via.placeholder.com/60";

        memberList.innerHTML += `
        <div class="member-card">

            <div class="member-info">

                <img src="${photo}" alt="Photo">

                <div>
                    <div class="member-name">${member.name || ""}</div>
                    <div class="member-id">${member.memberId || ""}</div>
                </div>

            </div>

            <button class="view-btn" onclick="viewMember('${member.id}')">
                View
            </button>

        </div>
        `;
    });

}
async function loadMembers() {

    const snap = await getDocs(collection(db, "members"));

    members = [];

    snap.forEach(doc => {
        members.push({
            id: doc.id,
            ...doc.data()
        });
    });

    members.sort((a, b) =>
        (a.name || "").localeCompare(b.name || "")
    );

    renderMembers(members);
window.viewMember = function(id){

    const member = members.find(m => m.id === id);

    if(!member) return;

    alert(
        "👤 ନାମ : " + (member.name || "") +
        "\n\n🆔 Member ID : " + (member.memberId || "") +
        "\n\n👨 ପିତା : " + (member.father || "") +
        "\n\n📞 ମୋବାଇଲ : " + (member.mobile || "") +
        "\n\n🏠 ଠିକଣା : " + (member.address || "") +
        "\n\n💳 Txn ID : " + (member.txnId || "") +
        "\n\n✅ Paid : " + (member.paid ? "Yes" : "No")
    );

}
}

loadMembers();

</script>
</body>
</html>
